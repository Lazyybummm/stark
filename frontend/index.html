<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — backend console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10161A;
    --panel:#171F24;
    --panel-2:#1D262C;
    --panel-3:#232E35;
    --border:#2A363D;
    --border-soft:#212B31;
    --text:#E7EDEF;
    --text-dim:#93A3AB;
    --text-faint:#5C6E77;
    --accent:#E2A23B;
    --accent-ink:#1A1300;
    --good:#5FAE84;
    --danger:#D9614F;
    --pending:#7A8890;
    --radius-s:4px;
    --radius-m:8px;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', -apple-system, sans-serif;
    --serif:'Fraunces', serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent); color:var(--accent-ink);}
  button{font-family:inherit; font-size:inherit; cursor:pointer;}
  input, textarea, select{font-family:inherit; font-size:inherit; color:var(--text); background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-s); padding:8px 10px; outline:none;}
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}
  input::placeholder, textarea::placeholder{color:var(--text-faint);}
  a{color:var(--accent);}
  .mono{font-family:var(--mono);}
  .hidden{display:none !important;}

  /* ---------- shell ---------- */
  .shell{ display:flex; flex-direction:column; height:100vh; }

  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:10px 18px; border-bottom:1px solid var(--border);
    background:var(--panel); flex-shrink:0;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{ font-family:var(--serif); font-size:20px; font-weight:600; letter-spacing:-0.01em; }
  .brand-sub{ color:var(--text-faint); font-size:12px; }
  .topbar-spacer{ flex:1; }
  .conn{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-dim); }
  .conn-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; }
  .conn-dot.up{ background:var(--good); box-shadow:0 0 0 3px rgba(95,174,132,0.18); }
  .conn-dot.down{ background:var(--danger); }
  .who{ font-size:12.5px; color:var(--text-dim); }
  .who b{ color:var(--text); font-weight:600; }
  .btn{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:7px 13px; border-radius:var(--radius-s); font-weight:500; font-size:13px;
    transition:border-color .12s ease;
  }
  .btn:hover{ border-color:var(--text-faint); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger{ color:var(--danger); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--text-dim); padding:6px 10px; }
  .btn.ghost:hover{ color:var(--text); background:var(--panel-2); }
  .btn.small{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  .body{ flex:1; display:flex; min-height:0; }

  /* ---------- sidebar ---------- */
  .sidebar{
    width:290px; flex-shrink:0; border-right:1px solid var(--border);
    background:var(--panel); display:flex; flex-direction:column; min-height:0;
  }
  .sidebar-section{ padding:14px 14px 0 14px; }
  .field-label{ font-size:11.5px; color:var(--text-faint); margin-bottom:5px; display:block; }
  .field{ margin-bottom:10px; }
  .field input{ width:100%; }
  .row{ display:flex; gap:8px; }
  .row > *{ flex:1; }

  .tabs{ display:flex; gap:2px; padding:12px 14px 0 14px; }
  .tab{
    flex:1; text-align:center; padding:8px 4px; font-size:12.5px; color:var(--text-dim);
    background:transparent; border:1px solid var(--border); border-bottom:none;
    border-radius:var(--radius-s) var(--radius-s) 0 0;
  }
  .tab.active{ color:var(--text); background:var(--panel-2); }

  .list{ flex:1; overflow-y:auto; border-top:1px solid var(--border); }
  .list-empty{ padding:22px 16px; color:var(--text-faint); font-size:12.5px; line-height:1.6; }
  .item{
    display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer;
    border-bottom:1px solid var(--border-soft);
  }
  .item:hover{ background:var(--panel-2); }
  .item.active{ background:var(--panel-3); box-shadow:inset 2px 0 0 var(--accent); }
  .avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:var(--panel-3); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; color:var(--text-dim);
  }
  .item-main{ min-width:0; flex:1; }
  .item-title{ font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item-sub{ font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:var(--mono); }
  .item-badge{ width:7px; height:7px; border-radius:50%; background:var(--good); flex-shrink:0; }

  .newchat-form{ display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--border); }
  .newchat-form input{ flex:1; }

  .identity{ padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .identity .item-title{ font-size:14px; }

  /* ---------- chat pane ---------- */
  .chat{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); }
  .chat-empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-faint); gap:6px; text-align:center; padding:40px;
  }
  .chat-empty .em-title{ font-family:var(--serif); font-size:19px; color:var(--text-dim); }
  .chat-empty .em-sub{ font-size:13px; max-width:360px; }

  .chat-header{
    display:flex; align-items:center; gap:12px; padding:12px 18px;
    border-bottom:1px solid var(--border); background:var(--panel); flex-shrink:0;
  }
  .chat-header .item-title{ font-size:14.5px; }
  .chat-header .item-sub{ font-size:12px; }
  .chat-header-spacer{ flex:1; }

  .pin-bar{
    display:flex; align-items:center; gap:10px; padding:8px 18px;
    background:rgba(226,162,59,0.08); border-bottom:1px solid var(--border);
    font-size:12.5px; color:var(--text-dim); flex-shrink:0;
  }
  .pin-bar b{ color:var(--accent); font-weight:600; }
  .pin-bar .pin-text{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .messages{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:3px; }
  .msg-day{ text-align:center; color:var(--text-faint); font-size:11px; margin:14px 0 8px; }
  .bubble-row{ display:flex; margin-bottom:2px; }
  .bubble-row.me{ justify-content:flex-end; }
  .bubble{
    max-width:62%; padding:8px 12px; border-radius:12px; position:relative;
    background:var(--panel-2); border:1px solid var(--border);
  }
  .bubble-row.me .bubble{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); border-bottom-right-radius:3px; }
  .bubble-row:not(.me) .bubble{ border-bottom-left-radius:3px; }
  .bubble-sender{ font-size:11px; color:var(--accent); font-weight:600; margin-bottom:2px; }
  .bubble-row.me .bubble-sender{ display:none; }
  .bubble-text{ font-size:13.5px; white-space:pre-wrap; word-break:break-word; }
  .bubble-meta{ display:flex; align-items:center; gap:5px; margin-top:3px; font-size:10.5px; color:var(--text-faint); }
  .bubble-row.me .bubble-meta{ color:rgba(26,19,0,0.6); }
  .bubble.pending{ opacity:.65; }
  .bubble.pinned{ box-shadow:0 0 0 1px var(--accent); }
  .tick{ font-family:var(--mono); }
  .tick.seen{ color:var(--good); }
  .bubble-row.me .tick.seen{ color:#1A1300; font-weight:700; }
  .bubble-actions{ display:flex; gap:4px; margin-top:4px; }
  .bubble-actions button{
    font-size:10px; background:transparent; border:none; color:var(--text-faint);
    text-decoration:underline; padding:0;
  }
  .bubble-row.me .bubble-actions button{ color:rgba(26,19,0,0.55); }

  .typing-line{ padding:0 18px 6px; font-size:12px; color:var(--text-faint); font-style:italic; min-height:18px; flex-shrink:0; }

  .composer{ display:flex; gap:8px; align-items:flex-end; padding:12px 18px; border-top:1px solid var(--border); background:var(--panel); flex-shrink:0; }
  .composer textarea{ flex:1; resize:none; height:38px; max-height:120px; padding-top:9px; }
  .composer .btn.primary{ height:38px; }

  /* ---------- group settings drawer (inline panel) ---------- */
  .group-panel{ border-bottom:1px solid var(--border); background:var(--panel); overflow:hidden; flex-shrink:0; }
  .group-panel-inner{ padding:14px 18px; display:flex; flex-wrap:wrap; gap:22px; }
  .gp-block{ min-width:220px; }
  .gp-block h4{ margin:0 0 8px; font-size:11.5px; text-transform:none; letter-spacing:0; color:var(--text-faint); font-weight:600; }
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--panel-3); border:1px solid var(--border);
    padding:4px 6px 4px 10px; border-radius:20px; font-size:12px; font-family:var(--mono);
  }
  .chip.admin{ border-color:var(--accent); color:var(--accent); }
  .chip button{ background:transparent; border:none; color:var(--text-faint); font-size:14px; line-height:1; padding:0 2px; }
  .chip button:hover{ color:var(--danger); }
  .gp-form{ display:flex; gap:6px; }
  .gp-form input, .gp-form select{ flex:1; }

  /* ---------- console ---------- */
  .console{ width:380px; flex-shrink:0; border-left:1px solid var(--border); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  .console-tabs{ display:flex; border-bottom:1px solid var(--border); }
  .console-tab{ flex:1; padding:10px; text-align:center; font-size:12.5px; color:var(--text-dim); background:transparent; border:none; border-bottom:2px solid transparent; }
  .console-tab.active{ color:var(--text); border-bottom-color:var(--accent); }
  .log-list{ flex:1; overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:6px; }
  .log-empty{ padding:22px 16px; color:var(--text-faint); font-size:12.5px; }
  .log-entry{ border:1px solid var(--border-soft); border-radius:var(--radius-s); background:var(--panel-2); overflow:hidden; }
  .log-head{ display:flex; align-items:center; gap:8px; padding:7px 9px; cursor:pointer; }
  .log-dir{ font-size:9.5px; font-weight:700; padding:2px 5px; border-radius:3px; letter-spacing:.03em; flex-shrink:0; }
  .log-dir.out{ background:rgba(226,162,59,0.16); color:var(--accent); }
  .log-dir.in{ background:rgba(95,174,132,0.16); color:var(--good); }
  .log-dir.http{ background:rgba(147,163,171,0.16); color:var(--text-dim); }
  .log-dir.err{ background:rgba(217,97,79,0.16); color:var(--danger); }
  .log-label{ flex:1; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .log-time{ font-size:10px; color:var(--text-faint); font-family:var(--mono); flex-shrink:0; }
  .log-body{ padding:0 9px 9px; }
  .log-body pre{ margin:0; font-family:var(--mono); font-size:11px; color:var(--text-dim); white-space:pre-wrap; word-break:break-word; background:var(--panel); border:1px solid var(--border-soft); border-radius:3px; padding:8px; max-height:220px; overflow:auto; }

  .raw-send{ padding:14px; display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
  .raw-send textarea{ width:100%; height:160px; font-family:var(--mono); font-size:12px; }
  .raw-send select{ width:100%; }
  .hint{ font-size:11.5px; color:var(--text-faint); line-height:1.5; }

  /* ---------- auth screen ---------- */
  .auth-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
  .auth-card{ width:100%; max-width:380px; }
  .auth-title{ font-family:var(--serif); font-size:26px; font-weight:600; margin:0 0 4px; }
  .auth-sub{ color:var(--text-dim); font-size:13px; margin:0 0 22px; }
  .auth-tabs{ display:flex; gap:2px; margin-bottom:16px; }
  .auth-tab{ flex:1; padding:9px; text-align:center; border:1px solid var(--border); background:var(--panel); color:var(--text-dim); font-size:13px; border-radius:var(--radius-s); }
  .auth-tab.active{ background:var(--panel-2); color:var(--text); border-color:var(--text-faint); }
  .auth-error{ background:rgba(217,97,79,0.1); border:1px solid rgba(217,97,79,0.35); color:var(--danger); padding:9px 11px; border-radius:var(--radius-s); font-size:12.5px; margin-bottom:12px; }
  .config-toggle{ margin-top:16px; font-size:12px; color:var(--text-faint); text-align:center; }
  .config-toggle button{ background:none; border:none; color:var(--text-faint); text-decoration:underline; }
  .config-box{ margin-top:12px; padding:12px; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--panel); }

  /* toasts */
  .toasts{ position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
  .toast{
    background:var(--panel-3); border:1px solid var(--border); border-left:3px solid var(--good);
    padding:10px 14px; border-radius:var(--radius-s); font-size:12.5px; max-width:320px;
    box-shadow:0 6px 20px rgba(0,0,0,0.35); animation:in .15s ease;
  }
  .toast.err{ border-left-color:var(--danger); }
  .toast.info{ border-left-color:var(--text-faint); }
  @keyframes in{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001s !important; transition-duration:.001s !important; } }

  @media (max-width: 900px){
    .console{ position:fixed; right:0; top:0; bottom:0; z-index:40; box-shadow:-8px 0 24px rgba(0,0,0,0.4); }
    .sidebar{ position:fixed; left:0; top:53px; bottom:0; z-index:40; box-shadow:8px 0 24px rgba(0,0,0,0.4); }
  }
</style>
</head>
<body>

<div class="shell" id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
/* =========================================================================
   RELAY — test console for the messages/groups HTTP + WebSocket backend.
   Single-file, no build step. State lives in memory only (no storage APIs).
   ========================================================================= */

/* ---------------------------- state ---------------------------- */
const state = {
  httpBase: 'http://localhost:8000',
  wsUrl: 'ws://localhost:8080',
  configOpen: false,
  authTab: 'login',       // 'login' | 'signup'
  authError: '',
  token: null, me: { phone:null, name:null, user_id:null },

  ws: null, wsStatus: 'down',      // down | connecting | up

  conversations: [],       // from /myconversation: {id,user1_phone,user2_phone,last_message_at}
  dmMessagesByPhone: {},   // peerPhone -> [messages]
  dmMeta: {},              // peerPhone -> { conversationId, name? }

  groups: {},              // groupId -> {id, group_name, admin_phone, participants:Set, messages:[]}

  activeChat: null,        // {type:'dm', phone} | {type:'group', id}
  sidebarTab: 'chats',     // 'chats' | 'groups'
  typingFrom: {},          // key(peer) -> timeout handle, for showing "typing..."
  groupSettingsOpen: false,

  consoleOpen: true,
  consoleTab: 'log',       // 'log' | 'raw'
  log: [],

  pendingSeq: 1,
};

function newTempId(prefix){ return prefix + '_' + (state.pendingSeq++) + '_' + Math.random().toString(36).slice(2,7); }

/* ---------------------------- render root ---------------------------- */
function render(){
  const app = document.getElementById('app');
  if(!state.token){
    app.innerHTML = renderAuthScreen();
    bindAuthScreen();
    return;
  }
  app.innerHTML = `
    ${renderTopbar()}
    <div class="body">
      ${renderSidebar()}
      ${renderChatPane()}
      ${state.consoleOpen ? renderConsole() : ''}
    </div>
  `;
  bindTopbar(); bindSidebar(); bindChatPane(); if(state.consoleOpen) bindConsole();
}

/* ============================== AUTH ============================== */
function renderAuthScreen(){
  return `
  <div class="topbar">
    <div class="brand"><span class="brand-mark">Relay</span><span class="brand-sub">backend console</span></div>
    <div class="topbar-spacer"></div>
    <div class="conn"><span class="conn-dot ${state.wsStatus==='up'?'up':(state.wsStatus==='connecting'?'':'down')}"></span>${escapeHtml(state.httpBase)}</div>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Sign in to Relay</h1>
      <p class="auth-sub">Talks directly to your Express + WebSocket backend. Nothing here is stored beyond this browser tab.</p>
      <div class="auth-tabs">
        <button class="auth-tab ${state.authTab==='login'?'active':''}" data-tab="login">Log in</button>
        <button class="auth-tab ${state.authTab==='signup'?'active':''}" data-tab="signup">Sign up</button>
      </div>
      ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
      ${state.authTab==='login' ? `
        <form id="loginForm">
          <div class="field"><span class="field-label">Phone number</span><input class="mono" name="phone" placeholder="+91 98xxxxxx" required></div>
          <div class="field"><span class="field-label">Password</span><input type="password" name="password" placeholder="••••••••" required></div>
          <button class="btn primary" style="width:100%" type="submit">Log in</button>
        </form>
      ` : `
        <form id="signupForm">
          <div class="field"><span class="field-label">Name</span><input name="name" placeholder="Ada Lovelace" required></div>
          <div class="field"><span class="field-label">Phone number</span><input class="mono" name="phone" placeholder="+91 98xxxxxx" required></div>
          <div class="field"><span class="field-label">Password</span><input type="password" name="password" placeholder="••••••••" required></div>
          <button class="btn primary" style="width:100%" type="submit">Create account</button>
        </form>
      `}
      <div class="config-toggle"><button id="toggleConfig">${state.configOpen?'Hide':'Server settings'}</button></div>
      ${state.configOpen ? `
        <div class="config-box">
          <div class="field"><span class="field-label">HTTP base URL</span><input class="mono" id="cfgHttp" value="${escapeHtml(state.httpBase)}"></div>
          <div class="field" style="margin-bottom:0"><span class="field-label">WebSocket URL</span><input class="mono" id="cfgWs" value="${escapeHtml(state.wsUrl)}"></div>
        </div>
      ` : ''}
    </div>
  </div>`;
}

function bindAuthScreen(){
  document.querySelectorAll('.auth-tab').forEach(t=>t.addEventListener('click', ()=>{ state.authTab = t.dataset.tab; state.authError=''; render(); }));
  const tc = document.getElementById('toggleConfig');
  if(tc) tc.addEventListener('click', ()=>{ state.configOpen = !state.configOpen; render(); });
  const ch = document.getElementById('cfgHttp'); if(ch) ch.addEventListener('change', e=> state.httpBase = e.target.value.trim());
  const cw = document.getElementById('cfgWs'); if(cw) cw.addEventListener('change', e=> state.wsUrl = e.target.value.trim());

  const lf = document.getElementById('loginForm');
  if(lf) lf.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(lf);
    await doLogin(fd.get('phone').trim(), fd.get('password'));
  });
  const sf = document.getElementById('signupForm');
  if(sf) sf.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(sf);
    await doSignup(fd.get('name').trim(), fd.get('phone').trim(), fd.get('password'));
  });
}

async function doSignup(name, phone, password){
  state.authError='';
  const {ok, data, raw} = await httpCall('POST', '/signup', {name, phone, password});
  if(ok){
    toast('Account created — log in to continue.', 'good');
    state.authTab = 'login';
    render();
  } else {
    state.authError = extractErrorText(data, raw) || 'Signup failed.';
    render();
  }
}

async function doLogin(phone, password){
  state.authError='';
  const {ok, data, raw} = await httpCall('POST', '/login', {phone, password});
  if(ok && data && data.token){
    state.token = data.token;
    const claims = decodeJwt(data.token);
    state.me = { phone: claims.phone || phone, name: claims.name || null, user_id: claims.user_id || null };
    toast('Logged in as ' + (state.me.name || state.me.phone), 'good');
    connectWs();
    await loadConversations();
    render();
  } else {
    state.authError = extractErrorText(data, raw) || 'Login failed — check phone and password.';
    render();
  }
}

function extractErrorText(data, raw){
  if(data && typeof data === 'object'){
    if(typeof data.message === 'string' && data.message.toLowerCase() !== 'error occured') return data.message;
    if(data.error) return typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error));
  }
  if(typeof raw === 'string' && raw) return raw;
  return '';
}

function logout(){
  if(state.ws){ try{ state.ws.close(); }catch(e){} }
  Object.assign(state, {
    token:null, me:{phone:null,name:null,user_id:null}, ws:null, wsStatus:'down',
    conversations:[], dmMessagesByPhone:{}, dmMeta:{}, groups:{}, activeChat:null,
  });
  render();
}

function decodeJwt(token){
  try{
    const payload = token.split('.')[1];
    const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return {}; }
}

function hasAdHocChats(){
  return Object.keys(state.dmMeta).some(p => !state.conversations.some(c => c.user1_phone===p || c.user2_phone===p));
}

function renderChatItems(chats){
  // merge server conversations with any ad-hoc phones we've started chatting with locally
  const known = new Set();
  let html = '';
  chats.forEach(c=>{
    const peer = c.user1_phone === state.me.phone ? c.user2_phone : c.user1_phone;
    known.add(peer);
    html += chatItemHtml(peer, c.id);
  });
  Object.keys(state.dmMeta).forEach(peer=>{
    if(!known.has(peer)) html += chatItemHtml(peer, state.dmMeta[peer].conversationId);
  });
  return html;
}
function chatItemHtml(peer, conversationId){
  const active = state.activeChat && state.activeChat.type==='dm' && state.activeChat.phone===peer;
  const msgs = state.dmMessagesByPhone[peer] || [];
  const last = msgs[msgs.length-1];
  return `
    <div class="item ${active?'active':''}" data-open-dm="${escapeAttr(peer)}" data-cid="${escapeAttr(conversationId||'')}">
      <div class="avatar">${initials(peer)}</div>
      <div class="item-main">
        <div class="item-title mono">${escapeHtml(peer)}</div>
        <div class="item-sub">${last ? escapeHtml(truncate(last.content,34)) : 'no messages loaded'}</div>
      </div>
    </div>`;
}

async function openDm(phone, conversationId){
  if(!state.dmMeta[phone]) state.dmMeta[phone] = { conversationId: conversationId || null };
  if(conversationId) state.dmMeta[phone].conversationId = conversationId;
  state.activeChat = { type:'dm', phone };
  render();
  if(state.dmMeta[phone].conversationId && !state.dmMessagesByPhone[phone]){
    await loadDmMessages(phone, state.dmMeta[phone].conversationId);
  }
}

/* ============================== HTTP calls ============================== */
async function loadConversations(){
  const {ok, data} = await httpCall('POST', '/myconversation', {}, true);
  if(ok && Array.isArray(data)) state.conversations = data;
  else state.conversations = [];
  render();
}

async function loadDmMessages(peer, conversationId){
  const {ok, data} = await httpCall('POST', '/getmessages', { conversationId }, true);
  if(ok && data && Array.isArray(data.messages)){
    state.dmMessagesByPhone[peer] = data.messages;
  }
  render();
}

async function loadGroupMessages(groupId){
  const {ok, data} = await httpCall('POST', '/getgroupmessages', { groupId }, true);
  if(ok && data && Array.isArray(data.messages) && state.groups[groupId]){
    state.groups[groupId].messages = data.messages;
  }
  render();
}

    });
    let typingTimer = null;
    ta.addEventListener('input', ()=>{
      if(state.activeChat.type !== 'dm') return;
      sendWs('typing', { reciever_phonenum: state.activeChat.phone, sender_phone: state.me.phone });
      clearTimeout(typingTimer);
    });
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const content = new FormData(form).get('content').trim();
      if(!content) return;
      if(state.activeChat.type === 'dm') sendDmMessage(state.activeChat.phone, content);
      else sendGroupMessage(state.activeChat.id, content);
      ta.value=''; ta.focus();
    });
  }

  document.querySelectorAll('[data-mark-seen]').forEach(b=>b.addEventListener('click', ()=>{
    markSeen(b.dataset.markSeen, b.dataset.peer);
  }));

  const btnLoadHist = document.getElementById('btnLoadGroupHistory');
  if(btnLoadHist) btnLoadHist.addEventListener('click', ()=> loadGroupMessages(state.activeChat.id));

}

/* ---------------------------- chat actions (optimistic) ---------------------------- */
function sendDmMessage(peer, content){
  const tempid = newTempId('dm');
  const optimistic = { id:null, tempid, sender_phone: state.me.phone, receiver_phone: peer, content, created_at: new Date().toISOString(), status:'sending', _pending:true };
  if(!state.dmMessagesByPhone[peer]) state.dmMessagesByPhone[peer] = [];
  state.dmMessagesByPhone[peer].push(optimistic);
  if(!state.dmMeta[peer]) state.dmMeta[peer] = { conversationId:null };
  render();
  sendWs('chat', { sender_phonenum: state.me.phone, reciever_phonenum: peer, content, tempid });
}

function sendGroupMessage(groupId, content){
  const g = state.groups[groupId]; if(!g) return;
  const tempmsgId = newTempId('grp');
  const optimistic = { id:null, tempmsgId, sender_phone: state.me.phone, group_id: groupId, content, created_at: new Date().toISOString(), _pending:true };
  g.messages = g.messages || [];
  g.messages.push(optimistic);
  render();
  sendWs('sendtoroom', { roomId: groupId, tempmsgId, sender_phone: state.me.phone, message: content });
}

function markSeen(messageId, peer){
  sendWs('seen', { messageId, rec_phone: peer });
  const list = state.dmMessagesByPhone[peer] || [];
  const m = list.find(x=>String(x.id)===String(messageId));
  if(m){ m.status = 'seen'; render(); }
}

function createRoom(name){
  const tempid = newTempId('room');
  state._pendingRoomName = state._pendingRoomName || {};
  state._pendingRoomName[tempid] = name;
  sendWs('create-room', { sender_phone: state.me.phone, group_name: name, tempid });
}

function addMember(groupId, phone){
  sendWs('addtoroom', { roomId: groupId, receiver_phone: phone, sender_phone: state.me.phone });
}
function removeMember(groupId, phone){
  sendWs('removeuser', { roomId: groupId, receiver_phone: phone });
}
function leaveGroup(groupId, newAdmin){
  sendWs('leaveroom', { sender_phone: state.me.phone, roomId: groupId, newAdmin: newAdmin || undefined });
}
function pinMessage(msgId){ sendWs('pinmsg', { msgId, sender_phone: state.me.phone }); }
function unpinMessage(msgId){ sendWs('unpin', { msgId, sender_phone: state.me.phone }); }

/* ============================== WEBSOCKET ============================== */
function connectWs(){
  if(state.ws){ try{ state.ws.close(); }catch(e){} }
  state.wsStatus = 'connecting'; render();
  let socket;
  try{
    socket = new WebSocket(state.wsUrl);
  }catch(err){
    state.wsStatus = 'down'; addLog('err', 'WebSocket URL invalid', String(err)); render(); return;
  }
  state.ws = socket;

  socket.addEventListener('open', ()=>{
    state.wsStatus = 'up';
    addLog('out', 'connection opened', {url: state.wsUrl});
    sendWs('auth', state.token);
    render();
  });
  socket.addEventListener('close', ()=>{
    state.wsStatus = 'down';
    addLog('in', 'connection closed', {});
    render();
  });
  socket.addEventListener('error', ()=>{
    addLog('err', 'socket error', {});
  });
  socket.addEventListener('message', (ev)=> handleWsMessage(ev.data));
}

function sendWs(event, data){
  if(!state.ws || state.wsStatus !== 'up'){
    toast('Not connected — click Reconnect.', 'err');
    return;
  }
  const payload = { event, data };
  addLog('out', event, payload);
  state.ws.send(JSON.stringify(payload));
}

function handleWsMessage(raw){
  let msg;
  try{ msg = JSON.parse(raw); }
  catch(e){ addLog('in', 'text', raw); if(raw==='connected') toast('WebSocket connected.', 'info'); return; }

  const ev = (msg.event || '').trim();
  addLog('in', ev || '(no event field)', msg);

  switch(ev){
    case 'group-data': {
      const rows = Array.isArray(msg.message) ? msg.message : [];
      rows.forEach(r=>{
        const existing = state.groups[r.id];
        state.groups[r.id] = {
          id: r.id, group_name: r.group_name, admin_phone: r.admin_phone,
          participants: new Set(r.participants||[]),
          messages: existing ? existing.messages : [],
          pinned: existing ? existing.pinned : null,
        };
      });
      render();
      break;
    }
    case 'chat': {
      const message = msg.messageResult || msg.content;
      if(message){
        const peer = message.sender_phone === state.me.phone ? message.receiver_phone : message.sender_phone;
        if(!state.dmMessagesByPhone[peer]) state.dmMessagesByPhone[peer] = [];
        state.dmMessagesByPhone[peer].push(message);
        if(!state.dmMeta[peer]) state.dmMeta[peer] = { conversationId: message.conversation_id || null };
        if(message.conversation_id) state.dmMeta[peer].conversationId = message.conversation_id;
        if(!(state.activeChat && state.activeChat.type==='dm' && state.activeChat.phone===peer)) toast(peer+': '+truncate(message.content,60), 'info');
      }
      render();
      break;
    }
    case 'typing': {
      const peer = msg.sender_phone;
      if(peer){
        state.typingFrom[peer] = true; render();
        clearTimeout(state._typingTimers && state._typingTimers[peer]);
        state._typingTimers = state._typingTimers || {};
        state._typingTimers[peer] = setTimeout(()=>{ delete state.typingFrom[peer]; render(); }, 2500);
      }
      break;
    }
    case 'seen': {
      Object.values(state.dmMessagesByPhone).forEach(list=>{
        const m = list.find(x=>String(x.id)===String(msg.messageId));
        if(m) m.status = 'seen';
      });
      render();
      break;
    }
    case 'group message recieved': {
      const m = msg.message;
      if(m && state.groups[m.group_id]){
        state.groups[m.group_id].messages = state.groups[m.group_id].messages || [];
        state.groups[m.group_id].messages.push(m);
        if(!(state.activeChat && state.activeChat.type==='group' && state.activeChat.id===m.group_id)) toast('New message in group', 'info');
      }
      render();
      break;
    }
    case 'added to a room': {
      toast('Added to group "'+msg.groupName+'"', 'good');
      break;
    }
    case 'user added': toast('Member added.', 'good'); break;
    case 'unathorized action': toast(msg.message || 'Not authorized.', 'err'); break;
    case 'invalid room creds': toast(msg.message || 'Group does not exist.', 'err'); break;
    case 'removed from the group': {
      toast('You were removed from a group.', 'err');
      if(msg.roomId){ delete state.groups[msg.roomId]; if(state.activeChat && state.activeChat.id===msg.roomId) state.activeChat=null; }
      render();
      break;
    }
    case 'user removal': toast(msg.message || 'Member removed.', 'good'); break;
    case 'notify others': {
      toast(msg.message || 'Group updated.', 'info');
      if(msg.roomId && state.groups[msg.roomId]){
        state.groups[msg.roomId].messages = state.groups[msg.roomId].messages || [];
        state.groups[msg.roomId].messages.push({ id:null, sender_phone:'system', sender_name:'System', content: msg.message, created_at: new Date().toISOString(), group_id: msg.roomId, system:true });
        render();
      }
      break;
    }
    case 'removal success': toast(msg.message || 'Removed.', 'good'); break;
    case 'error while removal': toast(msg.message || 'Removal failed.', 'err'); break;
    case 'not participant': toast(msg.message || 'User not in group.', 'err'); break;
    case 'left-group': {
      toast(msg.message || 'You left the group.', 'good');
      if(state.activeChat && state.activeChat.type==='group'){ delete state.groups[state.activeChat.id]; state.activeChat=null; }
      render();
      break;
    }
    case 'issue with group leaving': toast(msg.message || 'Could not leave group.', 'err'); break;
    case 'error': toast(msg.err_msg || msg.message || 'Server error.', 'err'); break;
    case 'auth': {
      toast('Session expired — please log in again.', 'err');
      logout();
      break;
    }
    case 'pinned':
    case 'unpinned': {
      const info = msg.pinInfo;
      if(info){
        const gid = info.group_id;
        if(gid && state.groups[gid]){
          state.groups[gid].pinned = ev==='pinned' && info.is_pinned ? info : (ev==='pinned' ? info : null);
          if(ev==='unpinned') state.groups[gid].pinned = null;
          const list = state.groups[gid].messages || [];
          const m = list.find(x=>String(x.id)===String(info.id));
          if(m) Object.assign(m, info);
        }
      }
      render();
      break;
    }
    default: {
      // no-event acks — disambiguate by shape (backend quirk: several acks omit "event")
      if(msg.tempid && msg.correctid && msg.status){
        reconcileDm(msg.tempid, msg.correctid, msg.status);
      } else if(msg.tempid && msg.correctid !== undefined && msg.message){
        reconcileRoom(msg.tempid, msg.correctid);
      } else if(msg.tempmsgId && msg.correctid !== undefined){
        reconcileGroupMsg(msg.tempmsgId, msg.correctid, msg.message);
      } else if(msg.message && !ev){
        toast(msg.message, msg.error ? 'err' : 'info');
      }
      render();
    }
  }
}

function reconcileDm(tempid, correctid, status){
  Object.keys(state.dmMessagesByPhone).forEach(peer=>{
    const list = state.dmMessagesByPhone[peer];
    const m = list.find(x=>x.tempid===tempid);
    if(m){ m.id = correctid; m.status = status; m._pending = false; }
  });
}
function reconcileRoom(tempid, correctid){
  const name = state._pendingRoomName && state._pendingRoomName[tempid];
  if(correctid){
    state.groups[correctid] = state.groups[correctid] || {
      id: correctid, group_name: name || ('Group '+correctid), admin_phone: state.me.phone,
      participants: new Set([state.me.phone]), messages: [], pinned: null,
    };
    toast('Group "'+(name||correctid)+'" created.', 'good');
  }
}
function reconcileGroupMsg(tempmsgId, correctid, message){
  Object.values(state.groups).forEach(g=>{
    const list = g.messages || [];
    const m = list.find(x=>x.tempmsgId===tempmsgId);
    if(m){ m.id = correctid; m._pending = false; }
  });
  if(message && typeof message === 'string' && /error/i.test(message)) toast(message, 'err');
}

/* ============================== CONSOLE ============================== */
function renderConsole(){
  return `
  <div class="console">
    <div class="console-tabs">
      <button class="console-tab ${state.consoleTab==='log'?'active':''}" data-ctab="log">Activity (${state.log.length})</button>
      <button class="console-tab ${state.consoleTab==='raw'?'active':''}" data-ctab="raw">Raw send</button>
    </div>
    ${state.consoleTab==='log' ? renderLogList() : renderRawSend()}
  </div>`;
}

function renderLogList(){
  if(state.log.length===0) return `<div class="log-list"><div class="log-empty">Every HTTP call and WebSocket event — sent and received — will appear here as you use the app.</div></div>`;
  const items = state.log.slice().reverse();
  return `<div class="log-list" id="logList">
    ${items.map((l,i)=>`
      <div class="log-entry">
        <div class="log-head" data-logtoggle="${l._id}">
          <span class="log-dir ${l.dir}">${l.dir}</span>
          <span class="log-label">${escapeHtml(l.label)}</span>
          <span class="log-time">${l.time}</span>
        </div>
        <div class="log-body ${l._open?'':'hidden'}" id="logbody-${l._id}"><pre>${escapeHtml(safeStringify(l.payload))}</pre></div>
      </div>
    `).join('')}
  </div>`;
}

function renderRawSend(){
  const events = ['auth','chat','typing','seen','create-room','addtoroom','sendtoroom','leaveroom','removeuser','pinmsg','unpin'];
  return `<div class="raw-send">
    <div class="hint">Send any event straight over the socket to test edge cases the UI doesn't cover. The payload is sent as <span class="mono">{event, data}</span>.</div>
    <div class="field"><span class="field-label">Event name</span>
      <select id="rawEvent">${events.map(e=>`<option value="${e}">${e}</option>`).join('')}<option value="__custom">custom…</option></select>
    </div>
    <div class="field" id="rawCustomWrap"><span class="field-label">Custom event name</span><input id="rawCustomEvent" placeholder="event name"></div>
    <div class="field"><span class="field-label">Data (JSON)</span><textarea id="rawData" spellcheck="false">{}</textarea></div>
    <button class="btn primary" id="rawSendBtn">Send over WebSocket</button>
    <div class="hint">HTTP endpoints are also logged automatically — trigger signup / login / load-history from the app to see their requests and responses here.</div>
  </div>`;
}

function bindConsole(){
  document.querySelectorAll('[data-ctab]').forEach(t=>t.addEventListener('click', ()=>{ state.consoleTab = t.dataset.ctab; render(); }));
  document.querySelectorAll('[data-logtoggle]').forEach(h=>h.addEventListener('click', ()=>{
    const id = h.dataset.logtoggle;
    const entry = state.log.find(l=>String(l._id)===id);
    if(entry) entry._open = !entry._open;
    render();
  }));
  const rawEvent = document.getElementById('rawEvent');
  const customWrap = document.getElementById('rawCustomWrap');
  if(rawEvent){
    const sync = ()=> customWrap.style.display = rawEvent.value==='__custom' ? 'block' : 'none';
    sync(); rawEvent.addEventListener('change', sync);
  }
  const btn = document.getElementById('rawSendBtn');
  if(btn) btn.addEventListener('click', ()=>{
    const evName = rawEvent.value==='__custom' ? document.getElementById('rawCustomEvent').value.trim() : rawEvent.value;
    let data;
    try{ data = JSON.parse(document.getElementById('rawData').value); }
    catch(e){ toast('Data must be valid JSON.', 'err'); return; }
    sendWs(evName, data);
  });
}

function addLog(dir, label, payload){
  state.log.push({ _id: state.log.length+1+'_'+Date.now(), dir, label, payload, time: formatClock(new Date()), _open:false });
  if(state.log.length > 300) state.log.shift();
  if(state.consoleOpen) queueMicrotask(()=>{ const el=document.getElementById('logList'); if(el && state.consoleTab==='log') el.scrollTop=0; });
}

/* ============================== HTTP wrapper ============================== */
async function httpCall(method, path, body, authed){
  const url = state.httpBase.replace(/\/$/,'') + path;
  const headers = { 'Content-Type': 'application/json' };
  if(authed && state.token) headers['token'] = state.token;
  const label = method + ' ' + path;
  addLog('http', label + ' →', { url, headers, body });
  try{
    const res = await fetch(url, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
    const text = await res.text();
    let data = null;
    try{ data = text ? JSON.parse(text) : null; }catch(e){ data = null; }
    addLog(res.ok ? 'http' : 'err', label + ' ← ' + res.status, data!==null ? data : text);
    return { ok: res.ok, status: res.status, data, raw: text };
  }catch(err){
    addLog('err', label + ' ← network error', String(err));
    return { ok:false, status:0, data:null, raw: String(err) };
  }
}

/* ============================== toasts & helpers ============================== */
function toast(text, kind){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err' ? ' err' : (kind==='info' ? ' info' : ''));
  el.textContent = text;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(), 260); }, 3400);
}

function initials(s){ if(!s) return '?'; const parts = String(s).replace(/[^a-zA-Z0-9 ]/g,' ').trim().split(/\s+/); if(parts.length===1) return parts[0].slice(0,2).toUpperCase(); return (parts[0][0]+parts[1][0]).toUpperCase(); }
function truncate(s,n){ if(!s) return ''; s=String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function formatTime(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function formatClock(d){ return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}); }
function safeStringify(o){ try{ return typeof o==='string' ? o : JSON.stringify(o, (k,v)=> v instanceof Set ? Array.from(v) : v, 2); }catch(e){ return String(o); } }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function escapeAttrText(s){ return escapeHtml(s); }

/* ---------------------------- boot ---------------------------- */
render();
</script>
