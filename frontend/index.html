<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relay — backend console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10161A;
    --panel:#171F24;
    --panel-2:#1D262C;
    --panel-3:#232E35;
    --border:#2A363D;
    --border-soft:#212B31;
    --text:#E7EDEF;
    --text-dim:#93A3AB;
    --text-faint:#5C6E77;
    --accent:#E2A23B;
    --accent-ink:#1A1300;
    --good:#5FAE84;
    --danger:#D9614F;
    --radius-s:4px;
    --radius-m:8px;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'Inter', -apple-system, sans-serif;
    --serif:'Fraunces', serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent); color:var(--accent-ink);}
  button{font-family:inherit; font-size:inherit; cursor:pointer;}
  input, textarea, select{font-family:inherit; font-size:inherit; color:var(--text); background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-s); padding:8px 10px; outline:none; transition:border-color .12s ease;}
  input:focus, textarea:focus, select:focus{border-color:var(--accent);}
  input::placeholder, textarea::placeholder{color:var(--text-faint);}
  a{color:var(--accent);}
  .mono{font-family:var(--mono);}
  .hidden{display:none !important;}

  .shell{ display:flex; flex-direction:column; height:100vh; }

  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:10px 18px; border-bottom:1px solid var(--border);
    background:var(--panel); flex-shrink:0;
  }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand-mark{ font-family:var(--serif); font-size:20px; font-weight:600; letter-spacing:-0.01em; }
  .brand-sub{ color:var(--text-faint); font-size:12px; }
  .topbar-spacer{ flex:1; }
  .conn{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--text-dim); }
  .conn-dot{ width:7px; height:7px; border-radius:50%; background:var(--text-faint); flex-shrink:0; transition:background .2s ease, box-shadow .2s ease; }
  .conn-dot.up{ background:var(--good); box-shadow:0 0 0 3px rgba(95,174,132,0.18); }
  .conn-dot.down{ background:var(--danger); }
  .conn-dot.connecting{ background:var(--accent); animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  .who{ font-size:12.5px; color:var(--text-dim); }
  .who b{ color:var(--text); font-weight:600; }
  .btn{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:7px 13px; border-radius:var(--radius-s); font-weight:500; font-size:13px;
    transition:border-color .12s ease, background .12s ease, filter .12s ease, opacity .12s ease;
  }
  .btn:hover{ border-color:var(--text-faint); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  .btn.primary:hover{ filter:brightness(1.06); }
  .btn.danger{ color:var(--danger); }
  .btn.danger.solid{ background:var(--danger); border-color:var(--danger); color:#2A0C08; }
  .btn.danger.solid:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--text-dim); padding:6px 10px; }
  .btn.ghost:hover{ color:var(--text); background:var(--panel-2); }
  .btn.small{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .hamburger{ display:none; background:transparent; border:1px solid var(--border); color:var(--text); border-radius:var(--radius-s); width:34px; height:34px; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .hamburger:hover{ border-color:var(--text-faint); }

  .body{ flex:1; display:flex; min-height:0; position:relative; }

  .sidebar{
    width:290px; flex-shrink:0; border-right:1px solid var(--border);
    background:var(--panel); display:flex; flex-direction:column; min-height:0;
  }
  .field-label{ font-size:11.5px; color:var(--text-faint); margin-bottom:5px; display:block; }
  .field{ margin-bottom:10px; }
  .field input{ width:100%; }

  .tabs{ display:flex; gap:2px; padding:12px 14px 0 14px; }
  .tab{
    flex:1; text-align:center; padding:8px 4px; font-size:12.5px; color:var(--text-dim);
    background:transparent; border:1px solid var(--border); border-bottom:none;
    border-radius:var(--radius-s) var(--radius-s) 0 0; transition:background .12s ease, color .12s ease;
  }
  .tab.active{ color:var(--text); background:var(--panel-2); }

  .list{ flex:1; overflow-y:auto; border-top:1px solid var(--border); }
  .list-empty{ padding:22px 16px; color:var(--text-faint); font-size:12.5px; line-height:1.6; }
  .item{
    display:flex; align-items:center; gap:10px; padding:10px 14px; cursor:pointer;
    border-bottom:1px solid var(--border-soft); transition:background .1s ease;
  }
  .item:hover{ background:var(--panel-2); }
  .item.active{ background:var(--panel-3); box-shadow:inset 2px 0 0 var(--accent); }

  .avatar-wrap{ position:relative; flex-shrink:0; }
  .avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:var(--panel-3); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; color:var(--text-dim);
  }
  .presence-dot{
    width:9px; height:9px; border-radius:50%; background:var(--text-faint);
    border:2px solid var(--panel); position:absolute; right:-1px; bottom:-1px;
    transition:background .2s ease;
  }
  .presence-dot.online{ background:var(--good); }
  .item-main{ min-width:0; flex:1; }
  .item-title{ font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item-sub{ font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:var(--mono); }
  .status-text{ font-size:11.5px; color:var(--text-faint); }
  .status-text.online{ color:var(--good); font-family:var(--sans); }

  .newchat-form{ display:flex; gap:6px; padding:10px 14px; border-top:1px solid var(--border); }
  .newchat-form input{ flex:1; }

  .identity{ padding:12px 14px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; }
  .identity .item-title{ font-size:14px; }

  .chat{ flex:1; display:flex; flex-direction:column; min-width:0; background:var(--bg); }
  .chat-empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-faint); gap:6px; text-align:center; padding:40px;
  }
  .chat-empty .em-title{ font-family:var(--serif); font-size:19px; color:var(--text-dim); }
  .chat-empty .em-sub{ font-size:13px; max-width:360px; }

  .chat-header{
    display:flex; align-items:center; gap:12px; padding:12px 18px;
    border-bottom:1px solid var(--border); background:var(--panel); flex-shrink:0;
  }
  .chat-header .item-title{ font-size:14.5px; }
  .chat-header .item-sub{ font-size:12px; }
  .chat-header-spacer{ flex:1; }

  .pin-bar{
    display:flex; flex-direction:column; padding:8px 18px;
    background:rgba(226,162,59,0.08); border-bottom:1px solid var(--border);
    font-size:12.5px; color:var(--text-dim); flex-shrink:0;
    animation:slideDown .14s ease;
    gap:4px;
  }
  @keyframes slideDown{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
  .pin-bar b{ color:var(--accent); font-weight:600; }
  .pin-bar .pin-text{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pin-row{
    display:flex; align-items:center; gap:10px;
  }
  .pin-row .pin-text{ font-size:12.5px; }
  .pin-meta{ font-size:10.5px; color:var(--text-faint); flex-shrink:0; }
  .pin-more{
    color:var(--accent); cursor:pointer; font-size:11px; font-weight:600;
    padding:2px 6px; border-radius:3px; background:rgba(226,162,59,0.1);
    transition:background .1s ease;
  }
  .pin-more:hover{ background:rgba(226,162,59,0.18); }
  .pin-divider{ border-top:1px solid var(--border-soft); margin:2px 0; }
  .pin-icon{ margin-right:2px; }

  .messages{ flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:3px; scroll-behavior:smooth; }
  .bubble-row{ display:flex; align-items:flex-end; margin-bottom:2px; position:relative; animation:bubbleIn .16s ease; }
  .bubble-row.me{ justify-content:flex-end; }
  @keyframes bubbleIn{ from{opacity:0; transform:translateY(5px);} to{opacity:1; transform:translateY(0);} }
  .bubble{
    max-width:62%; padding:8px 12px; border-radius:12px; position:relative;
    background:var(--panel-2); border:1px solid var(--border); transition:opacity .15s ease;
  }
  .bubble-row.me .bubble{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); border-bottom-right-radius:3px; }
  .bubble-row:not(.me) .bubble{ border-bottom-left-radius:3px; }
  .bubble-sender{ font-size:11px; color:var(--accent); font-weight:600; margin-bottom:2px; }
  .bubble-row.me .bubble-sender{ display:none; }
  .bubble-text{ font-size:13.5px; white-space:pre-wrap; word-break:break-word; }
  .bubble-meta{ display:flex; align-items:center; gap:5px; margin-top:3px; font-size:10.5px; color:var(--text-faint); }
  .bubble-row.me .bubble-meta{ color:rgba(26,19,0,0.6); }
  .bubble.pending{ opacity:.6; }
  .bubble.failed{ opacity:.85; box-shadow:0 0 0 1px var(--danger); }
  .bubble.pinned{ box-shadow:0 0 0 1px var(--accent); }
  .bubble.deleted{ opacity:.5; font-style:italic; color:var(--text-faint); }
  .tick{ font-family:var(--mono); }
  .tick.seen{ color:var(--good); }
  .tick.failed{ color:var(--danger); }
  .bubble-row.me .tick.seen{ color:#1A1300; font-weight:700; }
  .retry-link{ background:none; border:none; padding:0; margin-left:4px; color:inherit; text-decoration:underline; font-size:10.5px; cursor:pointer; }

  .message-actions-wrapper{ position:relative; display:inline-flex; align-self:flex-end; margin:0 6px; flex-shrink:0; }
  .menu-btn{
    background:var(--panel-3); border:1px solid var(--border); color:var(--text-dim); font-size:14px;
    width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    padding:0; cursor:pointer; line-height:1; transition:color .1s ease, border-color .1s ease;
  }
  .menu-btn:hover{ color:var(--text); border-color:var(--text-faint); }

  .action-menu{
    position:absolute; right:0; top:100%; background:var(--panel-2); border:1px solid var(--border);
    border-radius:var(--radius-s); padding:4px 0; min-width:150px; z-index:10;
    box-shadow:0 4px 16px rgba(0,0,0,0.4); display:none; animation:menuIn .1s ease;
  }
  @keyframes menuIn{ from{opacity:0; transform:translateY(-3px);} to{opacity:1; transform:translateY(0);} }
  .action-menu.open{ display:block; }
  .action-menu button{
    display:block; width:100%; padding:7px 14px; text-align:left;
    background:transparent; border:none; color:var(--text); font-size:12px;
    cursor:pointer;
  }
  .action-menu button:hover{ background:var(--panel-3); }
  .action-menu button.danger{ color:var(--danger); }

  .typing-line{ padding:0 18px 6px; font-size:12px; color:var(--text-faint); font-style:italic; min-height:18px; flex-shrink:0; }

  .composer{ display:flex; gap:8px; align-items:flex-end; padding:12px 18px; border-top:1px solid var(--border); background:var(--panel); flex-shrink:0; }
  .composer textarea{ flex:1; resize:none; height:38px; max-height:120px; padding-top:9px; }
  .composer .btn.primary{ height:38px; }

  .group-panel{ border-bottom:1px solid var(--border); background:var(--panel); overflow:hidden; flex-shrink:0; animation:slideDown .14s ease; }
  .group-panel-inner{ padding:14px 18px; display:flex; flex-wrap:wrap; gap:22px; }
  .gp-block{ min-width:220px; }
  .gp-block h4{ margin:0 0 8px; font-size:11.5px; text-transform:none; letter-spacing:0; color:var(--text-faint); font-weight:600; }
  .chip-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip{
    display:flex; align-items:center; gap:6px; background:var(--panel-3); border:1px solid var(--border);
    padding:4px 6px 4px 10px; border-radius:20px; font-size:12px; font-family:var(--mono);
    animation:chipIn .12s ease;
  }
  @keyframes chipIn{ from{opacity:0; transform:scale(.9);} to{opacity:1; transform:scale(1);} }
  .chip.admin{ border-color:var(--accent); color:var(--accent); }
  .chip button{ background:transparent; border:none; color:var(--text-faint); font-size:14px; line-height:1; padding:0 2px; }
  .chip button:hover{ color:var(--danger); }
  .gp-form{ display:flex; gap:6px; }
  .gp-form input, .gp-form select{ flex:1; }
  .hint{ font-size:11.5px; color:var(--text-faint); }

  .auth-wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
  .auth-card{ width:100%; max-width:380px; }
  .auth-title{ font-family:var(--serif); font-size:26px; font-weight:600; margin:0 0 4px; }
  .auth-sub{ color:var(--text-dim); font-size:13px; margin:0 0 22px; }
  .auth-tabs{ display:flex; gap:2px; margin-bottom:16px; }
  .auth-tab{ flex:1; padding:9px; text-align:center; border:1px solid var(--border); background:var(--panel); color:var(--text-dim); font-size:13px; border-radius:var(--radius-s); }
  .auth-tab.active{ background:var(--panel-2); color:var(--text); border-color:var(--text-faint); }
  .auth-error{ background:rgba(217,97,79,0.1); border:1px solid rgba(217,97,79,0.35); color:var(--danger); padding:9px 11px; border-radius:var(--radius-s); font-size:12.5px; margin-bottom:12px; }
  .config-toggle{ margin-top:16px; font-size:12px; color:var(--text-faint); text-align:center; }
  .config-toggle button{ background:none; border:none; color:var(--text-faint); text-decoration:underline; }
  .config-box{ margin-top:12px; padding:12px; border:1px solid var(--border); border-radius:var(--radius-m); background:var(--panel); }

  .toasts{ position:fixed; bottom:18px; right:18px; display:flex; flex-direction:column; gap:8px; z-index:50; }
  .toast{
    background:var(--panel-3); border:1px solid var(--border); border-left:3px solid var(--good);
    padding:10px 14px; border-radius:var(--radius-s); font-size:12.5px; max-width:320px;
    box-shadow:0 6px 20px rgba(0,0,0,0.35); animation:in .15s ease;
  }
  .toast.err{ border-left-color:var(--danger); }
  .toast.info{ border-left-color:var(--text-faint); }
  @keyframes in{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(8,11,13,0.6); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
    animation:fadeIn .12s ease;
  }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-card{
    background:var(--panel-2); border:1px solid var(--border); border-radius:var(--radius-m);
    width:100%; max-width:360px; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,0.5);
    animation:modalIn .15s ease;
  }
  @keyframes modalIn{ from{opacity:0; transform:scale(.96) translateY(4px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .modal-title{ font-family:var(--serif); font-size:17px; font-weight:600; margin:0 0 8px; }
  .modal-body{ font-size:13px; color:var(--text-dim); margin:0 0 18px; line-height:1.5; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  .backdrop{ display:none; }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.001s !important; transition-duration:.001s !important; } }
  @media (max-width: 900px){
    .hamburger{ display:flex; }
    .sidebar{
      position:fixed; left:0; top:53px; bottom:0; z-index:40; box-shadow:8px 0 24px rgba(0,0,0,0.4);
      transform:translateX(-102%); transition:transform .18s ease;
    }
    .sidebar.open{ transform:translateX(0); }
    .backdrop.open{ display:block; position:fixed; inset:53px 0 0 0; background:rgba(0,0,0,0.45); z-index:39; }
  }
</style>
</head>
<body>

<div class="shell" id="app"></div>
<div class="toasts" id="toasts"></div>

<script>
const state = {
  httpBase: 'http://localhost:8000',
  wsUrl: 'ws://localhost:8080',
  configOpen: false,
  authTab: 'login',
  authError: '',
  token: null, me: { phone:null, name:null, user_id:null },
  ws: null, wsStatus: 'down',
  conversations: [],
  dmMessagesByPhone: {},
  dmMeta: {},
  groups: {},
  presence: {},
  activeChat: null,
  sidebarTab: 'chats',
  sidebarOpen: false,
  typingFrom: {},
  groupSettingsOpen: false,
  pendingSeq: 1,
  openMenus: {},
  modal: null,
  stickToBottom: true,
  pendingAdd: null,
  pendingRemove: null,
  pinDropdownOpen: false,
};

let reconnectAttempts = 0;
let reconnectTimer = null;
let lastTypingSentAt = 0;

function newTempId(prefix){ return prefix + '_' + (state.pendingSeq++) + '_' + Math.random().toString(36).slice(2,7); }

function render(){
  const app = document.getElementById('app');
  if(!state.token){
    app.innerHTML = renderAuthScreen();
    bindAuthScreen();
    return;
  }
  app.innerHTML = renderTopbar()
    + `<div class="body">${renderSidebar()}<div class="backdrop ${state.sidebarOpen?'open':''}" id="sidebarBackdrop"></div>${renderChatPane()}</div>`
    + renderModal();
  bindTopbar(); bindSidebar(); bindChatPane(); bindModal();
}

function askConfirm({title, body, confirmLabel='Confirm', danger=false, onConfirm}){
  state.modal = {title, body, confirmLabel, danger, onConfirm};
  render();
}
function closeModal(){ state.modal = null; render(); }
function renderModal(){
  if(!state.modal) return '';
  const m = state.modal;
  return `<div class="modal-backdrop" id="modalBackdrop">
    <div class="modal-card">
      <h3 class="modal-title">${escapeHtml(m.title)}</h3>
      <p class="modal-body">${escapeHtml(m.body)}</p>
      <div class="modal-actions">
        <button class="btn ghost small" id="modalCancel">Cancel</button>
        <button class="btn small ${m.danger ? 'danger solid' : 'primary'}" id="modalConfirm">${escapeHtml(m.confirmLabel)}</button>
      </div>
    </div>
  </div>`;
}
function bindModal(){
  document.getElementById('modalBackdrop')?.addEventListener('click', (e)=>{ if(e.target.id==='modalBackdrop') closeModal(); });
  document.getElementById('modalCancel')?.addEventListener('click', closeModal);
  document.getElementById('modalConfirm')?.addEventListener('click', ()=>{
    const fn = state.modal?.onConfirm;
    closeModal();
    if(fn) fn();
  });
  if(state.modal){
    const onKey = (e)=>{ if(e.key==='Escape'){ closeModal(); document.removeEventListener('keydown', onKey); } };
    document.addEventListener('keydown', onKey);
  }
}

function renderAuthScreen(){
  return `
  <div class="topbar">
    <div class="brand"><span class="brand-mark">Relay</span><span class="brand-sub">backend console</span></div>
    <div class="topbar-spacer"></div>
    <div class="conn"><span class="conn-dot ${state.wsStatus==='up'?'up':(state.wsStatus==='connecting'?'connecting':'down')}"></span>${escapeHtml(state.httpBase)}</div>
  </div>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Sign in to Relay</h1>
      <p class="auth-sub">Talks directly to your Express + WebSocket backend.</p>
      <div class="auth-tabs">
        <button class="auth-tab ${state.authTab==='login'?'active':''}" data-tab="login">Log in</button>
        <button class="auth-tab ${state.authTab==='signup'?'active':''}" data-tab="signup">Sign up</button>
      </div>
      ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
      ${state.authTab==='login' ? `
        <form id="loginForm">
          <div class="field"><span class="field-label">Phone number</span><input class="mono" name="phone" placeholder="+91 98xxxxxx" value="${escapeAttr(state._prefillPhone||'')}" required></div>
          <div class="field"><span class="field-label">Password</span><input type="password" name="password" placeholder="••••••••" required></div>
          <button class="btn primary" style="width:100%" type="submit" id="loginSubmit">Log in</button>
        </form>
      ` : `
        <form id="signupForm">
          <div class="field"><span class="field-label">Name</span><input name="name" placeholder="Ada Lovelace" required></div>
          <div class="field"><span class="field-label">Phone number</span><input class="mono" name="phone" placeholder="+91 98xxxxxx" required></div>
          <div class="field"><span class="field-label">Password</span><input type="password" name="password" placeholder="••••••••" required></div>
          <button class="btn primary" style="width:100%" type="submit" id="signupSubmit">Create account</button>
        </form>
      `}

          <div class="field" style="margin-bottom:0"><span class="field-label">WebSocket URL</span><input class="mono" id="cfgWs" value="${escapeHtml(state.wsUrl)}"></div>
        </div>
      ` : ''}

  </div>`;
}

function bindAuthScreen(){
  document.querySelectorAll('.auth-tab').forEach(t=>t.addEventListener('click', ()=>{ state.authTab = t.dataset.tab; state.authError=''; render(); }));
  document.getElementById('toggleConfig')?.addEventListener('click', ()=>{ state.configOpen = !state.configOpen; render(); });
  document.getElementById('cfgHttp')?.addEventListener('change', e=> state.httpBase = e.target.value.trim());
  document.getElementById('cfgWs')?.addEventListener('change', e=> state.wsUrl = e.target.value.trim());
  document.getElementById('loginForm')?.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = document.getElementById('loginSubmit');
    btn.disabled = true; btn.textContent = 'Signing in…';
    await doLogin(fd.get('phone').trim(), fd.get('password'));
  });
  document.getElementById('signupForm')?.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = document.getElementById('signupSubmit');
    btn.disabled = true; btn.textContent = 'Creating…';
    await doSignup(fd.get('name').trim(), fd.get('phone').trim(), fd.get('password'));
  });
}

async function doSignup(name, phone, password){
  state.authError='';
  const {ok, data, raw} = await httpCall('POST', '/signup', {name, phone, password});
  if(ok){ toast('Account created — log in to continue.', 'good'); state.authTab='login'; state._prefillPhone = phone; render(); }
  else { state.authError = extractErrorText(data, raw) || 'Signup failed.'; render(); }
}

async function doLogin(phone, password){
  state.authError='';
  const {ok, data} = await httpCall('POST', '/login', {phone, password});
  if(ok && data?.token){
    state.token = data.token;
    const claims = decodeJwt(data.token);
    state.me = { phone: claims.phone || phone, name: claims.name || null, user_id: claims.user_id || null };
    toast('Logged in as ' + (state.me.name || state.me.phone), 'good');
    connectWs();
    await loadConversations();
    render();
  } else {
    state.authError = 'Login failed — check phone and password.';
    render();
  }
}

function extractErrorText(data, raw){
  if(data && typeof data === 'object'){
    if(typeof data.message === 'string' && data.message.toLowerCase() !== 'error occured') return data.message;
    if(data.error) return typeof data.error === 'string' ? data.error : (data.error.message || JSON.stringify(data.error));
  }
  if(typeof raw === 'string' && raw) return raw;
  return '';
}

function logout(){
  state.token = null;
  if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
  if(state.ws) try{ state.ws.close(); }catch(e){}
  Object.assign(state, {
    me:{phone:null,name:null,user_id:null}, ws:null, wsStatus:'down',
    conversations:[], dmMessagesByPhone:{}, dmMeta:{}, groups:{}, presence:{},
    activeChat:null, openMenus:{}, sidebarOpen:false, modal:null,
  });
  render();
}

function decodeJwt(token){
  try{
    const payload = token.split('.')[1];
    const json = decodeURIComponent(atob(payload.replace(/-/g,'+').replace(/_/g,'/')).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join(''));
    return JSON.parse(json);
  }catch(e){ return {}; }
}

function renderTopbar(){

function hasAdHocChats(){
  return Object.keys(state.dmMeta).some(p => !state.conversations.some(c => c.user1_phone===p || c.user2_phone===p));
}

function renderChatItems(chats){
  const known = new Set();
  let html = '';
  chats.forEach(c=>{
    const peer = c.user1_phone === state.me.phone ? c.user2_phone : c.user1_phone;
    known.add(peer);
    html += chatItemHtml(peer, c.id);
  });
  Object.keys(state.dmMeta).forEach(peer=>{
    if(!known.has(peer)) html += chatItemHtml(peer, state.dmMeta[peer].conversationId);
  });
  return html;
}
function chatItemHtml(peer, conversationId){
  const active = state.activeChat?.type==='dm' && state.activeChat.phone===peer;
  const msgs = state.dmMessagesByPhone[peer] || [];
  const last = msgs[msgs.length-1];
  return `<div class="item ${active?'active':''}" data-open-dm="${escapeAttr(peer)}" data-cid="${escapeAttr(conversationId||'')}">
    ${avatarWithPresence(peer, peer)}
    <div class="item-main"><div class="item-title mono">${escapeHtml(peer)}</div><div class="item-sub">${last ? escapeHtml(truncate(last.content,34)) : 'no messages'}</div></div>
  </div>`;
}

async function openDm(phone, conversationId){
  if(!state.dmMeta[phone]) state.dmMeta[phone] = { conversationId: conversationId || null };
  if(conversationId) state.dmMeta[phone].conversationId = conversationId;
  state.activeChat = { type:'dm', phone };
  state.stickToBottom = true;
  render();
  if(state.presence[phone] === undefined) sendWs('active-status', { rec_phone: phone });
  if(state.dmMeta[phone].conversationId && !state.dmMessagesByPhone[phone]){
    await loadDmMessages(phone, state.dmMeta[phone].conversationId);
  }
}

async function loadConversations(){
  const {ok, data} = await httpCall('POST', '/myconversation', {}, true);
  state.conversations = (ok && Array.isArray(data)) ? data : [];
  render();
}

async function loadDmMessages(peer, conversationId){
  const {ok, data} = await httpCall('POST', '/getmessages', { conversationId }, true);
  if(ok && data?.messages) state.dmMessagesByPhone[peer] = data.messages;
  render();
}

async function loadGroupMessages(groupId){
  const {ok, data} = await httpCall('POST', '/getgroupmessages', { groupId }, true);
  if(ok && data?.messages && state.groups[groupId]) state.groups[groupId].messages = data.messages;
  render();
}

function renderChatPane(){
  if(!state.activeChat) return `<div class="chat"><div class="chat-empty"><div class="em-title">Nothing open</div><div class="em-sub">Pick a conversation or group on the left.</div></div></div>`;
  if(state.activeChat.type === 'dm') return renderDmPane(state.activeChat.phone);
  return renderGroupPane(state.activeChat.id);
}

function renderDmPane(peer){
  const msgs = state.dmMessagesByPhone[peer] || [];
  const status = state.presence[peer];
  const statusLabel = status === 'online' ? 'online' : (status === 'offline' ? 'offline' : 'direct message');
  return `
  <div class="chat">
    <div class="chat-header">
      ${avatarWithPresence(peer, peer)}
      <div class="item-main"><div class="item-title mono">${escapeHtml(peer)}</div><div class="item-sub status-text ${status==='online'?'online':''}">${statusLabel}</div></div>
      <div class="chat-header-spacer"></div>
    </div>
    <div class="messages" id="messagesEl">${renderDmMessages(msgs, peer)}</div>

      <button class="btn primary" type="submit">Send</button>
    </form>

}

function renderDmMessages(msgs, peer){
  if(msgs.length===0) return `<div class="list-empty">No messages yet.</div>`;
  return msgs.map(m=>{
    const mine = m.sender_phone === state.me.phone;
    const pending = m._pending;
    const failed = m._failed;
    const seen = m.status === 'seen';
    const isDeletedForMe = m.visibility === 'all_except_sender' && m.sender_phone === state.me.phone;
    const isDeletedForEveryone = m.visibility === 'none';
    const showDeleted = isDeletedForMe || isDeletedForEveryone;
    const deletedText = isDeletedForMe ? 'You deleted this message' : 'This message was deleted';
    const pinned = m.is_pinned === true;
    const msgId = m.id;

    return `
    <div class="bubble-row ${mine?'me':''}">
      ${msgId && !showDeleted && mine ? `
      <div class="message-actions-wrapper">
        <button class="menu-btn" data-toggle-menu="${escapeAttr(msgId)}">⋮</button>
        <div class="action-menu" id="menu-${escapeAttr(msgId)}">
          <button data-delete-for-me="${escapeAttr(msgId)}" data-peer="${escapeAttr(peer)}">Delete for me</button>
          <button class="danger" data-delete-for-everyone="${escapeAttr(msgId)}" data-peer="${escapeAttr(peer)}" data-msgtype="conversation">Delete for everyone</button>
        </div>
      </div>` : ''}
      <div class="bubble ${pending?'pending':''} ${failed?'failed':''} ${pinned?'pinned':''} ${showDeleted?'deleted':''}">
        <div class="bubble-text">${showDeleted ? deletedText : escapeHtml(m.content)}</div>
        <div class="bubble-meta">
          <span>${formatTime(m.created_at)}</span>
          ${mine && !showDeleted ? `<span class="tick ${seen?'seen':''} ${failed?'failed':''}">${failed?'failed to send':(pending?'sending…':(seen?'✓✓ seen':(m.status==='delivered'?'✓✓':'✓')))}</span>` : ''}
          ${mine && failed ? `<button class="retry-link" data-retry-dm="${escapeAttr(m.tempid||'')}" data-peer="${escapeAttr(peer)}">retry</button>` : ''}
          ${pinned ? `<span class="tick" style="color:var(--accent);margin-left:4px;">📌 pinned</span>` : ''}
        </div>
      </div>
      ${msgId && !showDeleted && !mine ? `
      <div class="message-actions-wrapper">
        <button class="menu-btn" data-toggle-menu="${escapeAttr(msgId)}">⋮</button>
        <div class="action-menu" id="menu-${escapeAttr(msgId)}">
          ${!seen ? `<button data-mark-seen="${escapeAttr(msgId)}" data-peer="${escapeAttr(peer)}">Mark seen</button>` : ''}
        </div>
      </div>` : ''}
    </div>`;
  }).join('');
}

function renderGroupPane(groupId){
  const g = state.groups[groupId];
  if(!g) return `<div class="chat"><div class="chat-empty"><div class="em-title">Group not loaded</div></div></div>`;
  const msgs = g.messages || [];
  const isAdmin = g.admin_phone === state.me.phone;
  const participants = Array.from(g.participants || []);
  const pinnedMsgs = (msgs || []).filter(m => m.is_pinned === true);
  const latestPin = pinnedMsgs.length > 0 ? pinnedMsgs[0] : null;
  const hasMore = pinnedMsgs.length > 1;

  return `
  <div class="chat">
    <div class="chat-header">
      <div class="avatar">${initials(g.group_name)}</div>
      <div class="item-main"><div class="item-title">${escapeHtml(g.group_name)}</div><div class="item-sub">${participants.length} members${isAdmin?' · admin':''}</div></div>
      <div class="chat-header-spacer"></div>
      <button class="btn ghost small" id="btnLoadGroupHistory">Load history</button>
      <button class="btn ghost small" id="btnToggleGroupSettings">${state.groupSettingsOpen?'Hide members':'Members'}</button>
      ${isAdmin ? `<button class="btn danger small" id="btnDeleteGroup">Delete group</button>` : ''}
    </div>
    ${latestPin ? `
    <div class="pin-bar" id="pinBar">
      <div class="pin-row">
        <span class="pin-icon">📌</span>
        <span class="pin-text">${escapeHtml(latestPin.content)}</span>
        <span class="pin-meta">— ${escapeHtml(latestPin.sender_name || latestPin.sender_phone)} · ${formatTime(latestPin.pinned_at)}</span>
        ${hasMore ? `<span class="pin-more" id="pinMoreBtn">+${pinnedMsgs.length - 1} more</span>` : ''}
        ${isAdmin ? `<button class="btn ghost small" id="btnUnpinAll" style="font-size:10px;padding:2px 6px;">Unpin all</button>` : ''}
      </div>
      ${hasMore ? `
      <div class="pin-divider"></div>
      <div class="pin-dropdown" id="pinDropdown" style="display:${state.pinDropdownOpen ? 'flex' : 'none'};flex-direction:column;gap:4px;">
        ${pinnedMsgs.slice(1).map(m => `
          <div class="pin-row">
            <span class="pin-icon" style="font-size:10px;">📌</span>
            <span class="pin-text" style="font-size:12px;">${escapeHtml(m.content)}</span>
            <span class="pin-meta" style="font-size:10px;">— ${escapeHtml(m.sender_name || m.sender_phone)} · ${formatTime(m.pinned_at)}</span>
            ${isAdmin ? `<button class="btn ghost small" data-unpin="${escapeAttr(m.id)}" style="font-size:9px;padding:1px 4px;">Unpin</button>` : ''}
          </div>
        `).join('')}
      </div>` : ''}
    </div>` : ''}
    ${state.groupSettingsOpen ? renderGroupSettings(g, isAdmin, participants) : ''}
    <div class="messages" id="messagesEl">${renderGroupMessages(msgs, g)}</div>
    <div class="typing-line"></div>
    <form class="composer" id="composerForm">
      <textarea name="content" placeholder="Message ${escapeAttrText(g.group_name)}" required></textarea>
      <button class="btn primary" type="submit">Send</button>
    </form>

}

function renderGroupSettings(g, isAdmin, participants){
  return `
  <div class="group-panel"><div class="group-panel-inner">
    <div class="gp-block">
      <h4>Members (${participants.length})</h4>
      <div class="chip-list">${participants.map(p=>`
        <div class="chip ${p===g.admin_phone?'admin':''}">${escapeHtml(p)}${p===g.admin_phone?' · admin':''}

function renderGroupMessages(msgs, g){
  if(msgs.length===0) return `<div class="list-empty">No messages loaded.</div>`;
  const isAdmin = g.admin_phone === state.me.phone;
  return msgs.map(m=>{
    const mine = m.sender_phone === state.me.phone;
    const pending = m._pending;
    const failed = m._failed;
    const pinned = m.is_pinned === true;
    const isDeletedForMe = m.visibility === 'all_except_sender' && m.sender_phone === state.me.phone;
    const isDeletedForEveryone = m.visibility === 'none';
    const showDeleted = isDeletedForMe || isDeletedForEveryone;
    const deletedText = isDeletedForMe ? 'You deleted this message' : 'This message was deleted';
    const msgId = m.id;
    const menu = msgId && !showDeleted ? `
      <div class="message-actions-wrapper">
        <button class="menu-btn" data-toggle-menu="${escapeAttr(msgId)}">⋮</button>
        <div class="action-menu" id="menu-${escapeAttr(msgId)}">
          ${isAdmin ? (pinned ? `<button data-unpin="${escapeAttr(msgId)}">Unpin</button>` : `<button data-pin="${escapeAttr(msgId)}">Pin</button>`) : ''}
          ${mine ? `<button data-delete-for-me="${escapeAttr(msgId)}">Delete for me</button>` : ''}
          ${(isAdmin || mine) ? `<button class="danger" data-delete-for-everyone="${escapeAttr(msgId)}" data-msgtype="group">Delete for everyone</button>` : ''}
        </div>
      </div>` : '';

    return `
    <div class="bubble-row ${mine?'me':''}">
      ${mine ? menu : ''}
      <div class="bubble ${pending?'pending':''} ${failed?'failed':''} ${pinned?'pinned':''} ${showDeleted?'deleted':''}">
        ${!mine && !showDeleted ? `<div class="bubble-sender">${escapeHtml(m.sender_name || m.sender_phone)}</div>` : ''}
        <div class="bubble-text">${showDeleted ? deletedText : escapeHtml(m.content)}</div>
        <div class="bubble-meta"><span>${formatTime(m.created_at)}</span>${failed?'<span class="tick failed">failed</span>':(pending?'<span>sending…</span>':'')}
          ${mine && failed ? `<button class="retry-link" data-retry-group="${escapeAttr(m.tempmsgId||'')}" data-group="${escapeAttr(g.id)}">retry</button>` : ''}
          ${pinned ? `<span class="tick" style="color:var(--accent);margin-left:4px;">📌 pinned</span>` : ''}
        </div>
      </div>
      ${!mine ? menu : ''}
    </div>`;
  }).join('');
}

function bindChatPane(){
  const msgsEl = document.getElementById('messagesEl');
  if(msgsEl){
    if(state.stickToBottom) msgsEl.scrollTop = msgsEl.scrollHeight;
    msgsEl.onscroll = ()=>{
      state.stickToBottom = (msgsEl.scrollHeight - msgsEl.scrollTop - msgsEl.clientHeight) < 100;
    };
  }

  const pinMoreBtn = document.getElementById('pinMoreBtn');
  if(pinMoreBtn){
    pinMoreBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      state.pinDropdownOpen = !state.pinDropdownOpen;
      render();
    });
  }

  document.addEventListener('click', ()=>{
    if(state.pinDropdownOpen){
      state.pinDropdownOpen = false;
      render();
    }
  });

  document.querySelectorAll('[data-toggle-menu]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = btn.dataset.toggleMenu;
      const menu = document.getElementById('menu-' + id);
      if(menu){
        document.querySelectorAll('.action-menu').forEach(m => { if(m.id !== 'menu-'+id) m.classList.remove('open'); });
        menu.classList.toggle('open');
      }
    });
  });

  document.addEventListener('click', ()=>{
    document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('open'));
  }, { once:true });

  document.querySelectorAll('[data-mark-seen]').forEach(b=>b.addEventListener('click', ()=>{
    markSeen(b.dataset.markSeen, b.dataset.peer);
  }));

  document.querySelectorAll('[data-delete-for-me]').forEach(b=>b.addEventListener('click', ()=>{
    const msgId = b.dataset.deleteForMe;
    const msgType = state.activeChat.type === 'dm' ? 'conversation' : 'group';
    applyLocalDelete(msgId, 'me');
    sendWs('deletforme', { msgId, sender_phone: state.me.phone, msgType });
  }));

  document.querySelectorAll('[data-delete-for-everyone]').forEach(b=>b.addEventListener('click', ()=>{
    const msgId = b.dataset.deleteForEveryone;
    const msgType = b.dataset.msgtype || 'conversation';
    askConfirm({
      title: 'Delete for everyone?',
      body: 'This removes the message for every participant. This cannot be undone.',
      confirmLabel: 'Delete',
      danger: true,
      onConfirm: ()=>{
        applyLocalDelete(msgId, 'everyone');
        sendWs('globaldelete', { msgId, sender_phone: state.me.phone, msgType });
      }
    });
  }));

  document.querySelectorAll('[data-unpin]').forEach(b=>b.addEventListener('click', ()=>{
    const msgId = b.dataset.unpin;
    unpinMessage(msgId);
    if(state.pinDropdownOpen){
      state.pinDropdownOpen = false;
      render();
    }
  }));

  document.querySelectorAll('[data-retry-dm]').forEach(b=>b.addEventListener('click', ()=>{
    retryDmMessage(b.dataset.peer, b.dataset.retryDm);
  }));
  document.querySelectorAll('[data-retry-group]').forEach(b=>b.addEventListener('click', ()=>{
    retryGroupMessage(b.dataset.group, b.dataset.retryGroup);
  }));

  document.getElementById('btnLoadGroupHistory')?.addEventListener('click', ()=> loadGroupMessages(state.activeChat.id));
  document.getElementById('btnDeleteGroup')?.addEventListener('click', ()=>{
    askConfirm({
      title: 'Delete this group?',
      body: 'This permanently deletes the group and its messages for everyone. This cannot be undone.',
      confirmLabel: 'Delete group',
      danger: true,
      onConfirm: ()=>{
        const gid = state.activeChat.id;
        sendWs('deletegroup', { roomId: gid, sender_phone: state.me.phone });
        delete state.groups[gid];
        state.activeChat = null;
        render();
      }
    });
  });
  document.getElementById('btnToggleGroupSettings')?.addEventListener('click', ()=>{ state.groupSettingsOpen = !state.groupSettingsOpen; render(); });

  document.getElementById('addMemberForm')?.addEventListener('submit', (e)=>{
    e.preventDefault();
    const phone = new FormData(e.target).get('phone').trim();
    if(phone){ addMember(state.activeChat.id, phone); e.target.reset(); }
  });
  document.querySelectorAll('[data-remove-member]').forEach(b=>b.addEventListener('click', ()=>{
    removeMember(state.activeChat.id, b.dataset.removeMember);
  }));
  document.getElementById('leaveGroupForm')?.addEventListener('submit', (e)=>{
    e.preventDefault();
    const newAdmin = new FormData(e.target).get('newAdmin');
    leaveGroup(state.activeChat.id, newAdmin || null);
  });
  document.querySelectorAll('[data-pin]').forEach(b=>b.addEventListener('click', ()=> pinMessage(b.dataset.pin)));
  document.getElementById('btnUnpin')?.addEventListener('click', ()=> unpinMessage(document.getElementById('btnUnpin').dataset.msg));
  document.querySelectorAll('[data-unpin]').forEach(b=>b.addEventListener('click', ()=> unpinMessage(b.dataset.unpin)));

  const form = document.getElementById('composerForm');
  if(form){
    const ta = form.querySelector('textarea');
    ta.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
    });
    ta.addEventListener('input', ()=>{
      if(state.activeChat.type !== 'dm') return;
      const now = Date.now();
      if(now - lastTypingSentAt > 1500){
        sendWs('typing', { reciever_phonenum: state.activeChat.phone, sender_phone: state.me.phone });
        lastTypingSentAt = now;
      }
    });
    form.addEventListener('submit', (e)=>{
      e.preventDefault();
      const content = new FormData(form).get('content').trim();
      if(!content) return;
      state.stickToBottom = true;
      if(state.activeChat.type === 'dm') sendDmMessage(state.activeChat.phone, content);
      else sendGroupMessage(state.activeChat.id, content);
      ta.value=''; ta.focus();
    });
  }
}

function findMessageById(msgId){
  for(const peer in state.dmMessagesByPhone){
    const m = state.dmMessagesByPhone[peer].find(x=>String(x.id)===String(msgId));
    if(m) return m;
  }
  for(const gid in state.groups){
    const list = state.groups[gid].messages || [];
    const m = list.find(x=>String(x.id)===String(msgId));
    if(m) return m;
  }
  return null;
}

function applyLocalDelete(msgId, mode){
  const m = findMessageById(msgId);
  if(m){ m.visibility = mode==='me' ? 'all_except_sender' : 'none'; render(); }
}

function sendDmMessage(peer, content){
  const tempid = newTempId('dm');
  const optimistic = { id:null, tempid, sender_phone: state.me.phone, receiver_phone: peer, content, created_at: new Date().toISOString(), status:'sending', _pending:true, visibility:'all', is_pinned:false };
  if(!state.dmMessagesByPhone[peer]) state.dmMessagesByPhone[peer] = [];
  state.dmMessagesByPhone[peer].push(optimistic);
  if(!state.dmMeta[peer]) state.dmMeta[peer] = { conversationId:null };
  render();
  const sent = sendWs('chat', { sender_phonenum: state.me.phone, reciever_phonenum: peer, content, tempid });
  if(!sent){ optimistic._pending = false; optimistic._failed = true; render(); }
}

function retryDmMessage(peer, tempid){
  const list = state.dmMessagesByPhone[peer] || [];
  const m = list.find(x=>x.tempid===tempid);
  if(!m) return;
  m._pending = true; m._failed = false; render();
  const sent = sendWs('chat', { sender_phonenum: state.me.phone, reciever_phonenum: peer, content: m.content, tempid });
  if(!sent){ m._pending = false; m._failed = true; render(); }
}

function sendGroupMessage(groupId, content){
  const g = state.groups[groupId]; if(!g) return;
  const tempmsgId = newTempId('grp');
  const optimistic = { id:null, tempmsgId, sender_phone: state.me.phone, group_id: groupId, content, created_at: new Date().toISOString(), _pending:true, visibility:'all', is_pinned:false };
  g.messages = g.messages || [];
  g.messages.push(optimistic);
  render();
  const sent = sendWs('sendtoroom', { roomId: groupId, tempmsgId, sender_phone: state.me.phone, message: content });
  if(!sent){ optimistic._pending = false; optimistic._failed = true; render(); }
}

function retryGroupMessage(groupId, tempmsgId){
  const g = state.groups[groupId]; if(!g) return;
  const m = (g.messages||[]).find(x=>x.tempmsgId===tempmsgId);
  if(!m) return;
  m._pending = true; m._failed = false; render();
  const sent = sendWs('sendtoroom', { roomId: groupId, tempmsgId, sender_phone: state.me.phone, message: m.content });
  if(!sent){ m._pending = false; m._failed = true; render(); }
}

function markSeen(messageId, peer){
  sendWs('seen', { messageId, rec_phone: peer });
  const list = state.dmMessagesByPhone[peer] || [];
  const m = list.find(x=>String(x.id)===String(messageId));
  if(m){ m.status = 'seen'; render(); }
}

function createRoom(name){
  const tempid = newTempId('room');
  state.groups[tempid] = { id: tempid, group_name: name, admin_phone: state.me.phone, participants: new Set([state.me.phone]), messages: [], pinned: null, _pending: true };
  state._pendingRoomName = state._pendingRoomName || {};
  state._pendingRoomName[tempid] = name;
  render();
  sendWs('create-room', { sender_phone: state.me.phone, group_name: name, tempid });
}

function addMember(groupId, phone){
  const g = state.groups[groupId];
  if(g && !g.participants.has(phone)){
    g.participants.add(phone);
    state.pendingAdd = { groupId, phone };
    render();
  }
  sendWs('addtoroom', { roomId: groupId, receiver_phone: phone, sender_phone: state.me.phone });
}

function removeMember(groupId, phone){
  askConfirm({
    title: 'Remove member?',
    body: phone + ' will be removed from the group.',
    confirmLabel: 'Remove',
    danger: true,
    onConfirm: ()=>{
      const g = state.groups[groupId];
      if(g){
        g.participants.delete(phone);
        state.pendingRemove = { groupId, phone };
        render();
      }
      sendWs('removeuser', { roomId: groupId, receiver_phone: phone });
    }
  });
}

function leaveGroup(groupId, newAdmin){
  askConfirm({
    title: 'Leave group?',
    body: 'You will stop receiving messages from this group.',
    confirmLabel: 'Leave',
    danger: true,
    onConfirm: ()=>{
      sendWs('leaveroom', { sender_phone: state.me.phone, roomId: groupId, newAdmin: newAdmin || undefined });
      delete state.groups[groupId];
      if(state.activeChat?.type==='group' && state.activeChat.id===groupId) state.activeChat = null;
      render();
    }
  });
}

function pinMessage(msgId){
  if(state.activeChat?.type === 'group'){
    const g = state.groups[state.activeChat.id];
    const m = (g?.messages||[]).find(x=>String(x.id)===String(msgId));
    if(g && m){ m.is_pinned = true; m.pinned_at = new Date().toISOString(); m.pinned_by = state.me.phone; render(); }
  }
  sendWs('pinmsg', { msgId, sender_phone: state.me.phone });
}

function unpinMessage(msgId){
  if(state.activeChat?.type === 'group'){
    const g = state.groups[state.activeChat.id];
    const m = (g?.messages||[]).find(x=>String(x.id)===String(msgId));
    if(g && m){ m.is_pinned = false; m.pinned_at = null; m.pinned_by = null; render(); }
  }
  sendWs('unpin', { msgId, sender_phone: state.me.phone });
}

function connectWs(){
  if(reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
  if(state.ws) try{ state.ws.close(); }catch(e){}
  state.wsStatus = 'connecting'; render();
  try{
    const socket = new WebSocket(state.wsUrl);
    state.ws = socket;
    socket.addEventListener('open', ()=>{
      reconnectAttempts = 0;
      state.wsStatus='up';
      sendWs('auth', state.token);
      render();
    });
    socket.addEventListener('close', ()=>{
      state.wsStatus='down'; render();
      if(state.token){
        const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 15000);
        reconnectAttempts++;
        reconnectTimer = setTimeout(connectWs, delay);
      }
    });
    socket.addEventListener('message', (ev)=> handleWsMessage(ev.data));
  }catch(err){
    state.wsStatus='down'; render();
  }
}

function sendWs(event, data){
  if(!state.ws || state.wsStatus !== 'up'){
    toast('Not connected — reconnecting…', 'err');
    return false;
  }
  state.ws.send(JSON.stringify({ event, data }));
  return true;
}

function handleWsMessage(raw){
  let msg;
  try{ msg = JSON.parse(raw); }
  catch(e){ if(raw==='connected') toast('WebSocket connected.', 'info'); return; }

  const ev = (msg.event || '').trim();

  switch(ev){
    case 'group-data': {
      const rows = Array.isArray(msg.message) ? msg.message : [];
      rows.forEach(r=>{
        const existing = state.groups[r.id];
        state.groups[r.id] = {
          id: r.id, group_name: r.group_name, admin_phone: r.admin_phone,
          participants: new Set(r.participants||[]),
          messages: existing?.messages || [],
        };
      });
      render();
      break;
    }
    case 'presence-list': {
      (msg.contacts||[]).forEach(c=>{ if(c && c.phone) state.presence[c.phone] = c.status; });
      render();
      break;
    }
    case 'presence': {
      if(msg.phone){ state.presence[msg.phone] = msg.status; render(); }
      break;
    }
    case 'chat': {
      const message = msg.messageResult || msg.content;
      if(message){
        const peer = message.sender_phone === state.me.phone ? message.receiver_phone : message.sender_phone;
        if(!state.dmMessagesByPhone[peer]) state.dmMessagesByPhone[peer] = [];
        state.dmMessagesByPhone[peer].push(message);
        if(!state.dmMeta[peer]) state.dmMeta[peer] = { conversationId: message.conversation_id || null };
        if(message.conversation_id) state.dmMeta[peer].conversationId = message.conversation_id;
        if(!(state.activeChat?.type==='dm' && state.activeChat.phone===peer)) toast(peer+': '+truncate(message.content,60), 'info');
      }
      render();
      break;
    }
    case 'typing': {
      const peer = msg.sender_phone;
      if(peer){
        state.typingFrom[peer] = true; render();
        clearTimeout(state._typingTimers?.[peer]);
        state._typingTimers = state._typingTimers || {};
        state._typingTimers[peer] = setTimeout(()=>{ delete state.typingFrom[peer]; render(); }, 2500);
      }
      break;
    }
    case 'seen': {
      Object.values(state.dmMessagesByPhone).forEach(list=>{
        const m = list.find(x=>String(x.id)===String(msg.messageId));
        if(m) m.status = 'seen';
      });
      render();
      break;
    }
    case 'group message recieved': {
      const m = msg.message;
      if(m && state.groups[m.group_id]){
        state.groups[m.group_id].messages = state.groups[m.group_id].messages || [];
        state.groups[m.group_id].messages.push(m);
        if(!(state.activeChat?.type==='group' && state.activeChat.id===m.group_id)) toast('New message in group', 'info');
      }
      render();
      break;
    }
    case 'added to a room': toast('Added to group "'+msg.groupName+'"', 'good'); break;
    case 'user added': state.pendingAdd = null; toast('Member added.', 'good'); break;
    case 'unathorized action': {
      if(state.pendingAdd){
        const g = state.groups[state.pendingAdd.groupId];
        if(g) g.participants.delete(state.pendingAdd.phone);
        state.pendingAdd = null;
      }
      toast(msg.message || 'Not authorized.', 'err');
      render();
      break;
    }
    case 'invalid room creds': toast(msg.message || 'Group does not exist.', 'err'); break;
    case 'removed from the group': {
      toast('You were removed from a group.', 'err');
      if(msg.roomId){ delete state.groups[msg.roomId]; if(state.activeChat?.id===msg.roomId) state.activeChat=null; }
      render();
      break;
    }
    case 'user removal': toast(msg.message || 'Member removed.', 'good'); break;
    case 'notify others': {
      if(msg.roomId && state.groups[msg.roomId]){
        state.groups[msg.roomId].messages = state.groups[msg.roomId].messages || [];
        state.groups[msg.roomId].messages.push({ id:null, sender_phone:'system', sender_name:'System', content: msg.message, created_at: new Date().toISOString(), group_id: msg.roomId, system:true });
        render();
      }
      break;
    }
    case 'removal success': toast(msg.message || 'Removed.', 'good'); state.pendingRemove = null; break;
    case 'error while removal':
    case 'not participant': {
      if(state.pendingRemove){
        const g = state.groups[state.pendingRemove.groupId];
        if(g) g.participants.add(state.pendingRemove.phone);
        state.pendingRemove = null;
      }
      toast(msg.message || 'Could not remove member.', 'err');
      render();
      break;
    }
    case 'left-group': toast(msg.message || 'You left the group.', 'good'); break;
    case 'issue with group leaving': toast(msg.message || 'Could not leave group.', 'err'); break;
    case 'error': toast(msg.err_msg || msg.message || 'Server error.', 'err'); break;
    case 'auth': toast('Session expired — please log in again.', 'err'); logout(); break;
    case 'pinned':
    case 'unpinned': {
      const info = msg.pinInfo;
      if(info){
        const gid = info.group_id;
        if(gid && state.groups[gid]){
          const list = state.groups[gid].messages || [];
          const m = list.find(x=>String(x.id)===String(info.id));
          if(m){ m.is_pinned = info.is_pinned; m.pinned_at = info.pinned_at; m.pinned_by = info.pinned_by; render(); }
        } else {
          const peer = info.sender_phone === state.me.phone ? info.receiver_phone : info.sender_phone;
          const list = state.dmMessagesByPhone[peer] || [];
          const m = list.find(x=>String(x.id)===String(info.id));
          if(m){ m.is_pinned = info.is_pinned; m.pinned_at = info.pinned_at; m.pinned_by = info.pinned_by; render(); }
        }
      }
      render();
      break;
    }
    case 'message_global_deleted': {
      const data = msg.data;
      if(data){
        if(data.msgType === 'group' && data.message.group_id && state.groups[data.message.group_id]){
          const list = state.groups[data.message.group_id].messages || [];
          const m = list.find(x=>String(x.id)===String(data.messageId));
          if(m) Object.assign(m, data.message);
        } else if(data.msgType === 'conversation'){
          const peer = data.message.sender_phone === state.me.phone ? data.message.receiver_phone : data.message.sender_phone;
          const list = state.dmMessagesByPhone[peer] || [];
          const m = list.find(x=>String(x.id)===String(data.messageId));
          if(m) Object.assign(m, data.message);
        }
        render();
      }
      break;
    }
    case 'global_delete_success': break;
    case 'delete_for_me_success': break;
    case 'group_deleted': {
      toast('Group deleted by admin.', 'err');
      const groupId = msg.data?.groupId;
      if(groupId){ delete state.groups[groupId]; if(state.activeChat?.id===groupId) state.activeChat=null; }
      render();
      break;
    }
    default: {
      if(msg.tempid && msg.correctid && msg.status){
        Object.keys(state.dmMessagesByPhone).forEach(peer=>{
          const list = state.dmMessagesByPhone[peer];
          const m = list.find(x=>x.tempid===msg.tempid);
          if(m){ m.id = msg.correctid; m.status = msg.status; m._pending = false; m._failed = false; }
        });
      } else if(msg.tempid && msg.correctid){
        const name = state._pendingRoomName?.[msg.tempid];
        if(msg.correctid){
          const finalGroup = {
            id: msg.correctid, group_name: name || ('Group '+msg.correctid), admin_phone: state.me.phone,
            participants: new Set([state.me.phone]), messages: [],
          };
          delete state.groups[msg.tempid];
          state.groups[msg.correctid] = state.groups[msg.correctid] || finalGroup;
          if(state.activeChat?.type==='group' && state.activeChat.id===msg.tempid) state.activeChat = { type:'group', id: msg.correctid };
          toast('Group "'+(name||msg.correctid)+'" created.', 'good');
        }
      } else if(msg.tempmsgId && msg.correctid){
        Object.values(state.groups).forEach(g=>{
          const list = g.messages || [];
          const m = list.find(x=>x.tempmsgId===msg.tempmsgId);
          if(m){ m.id = msg.correctid; m._pending = false; m._failed = false; }
        });
      } else if(msg.message && !ev){
        toast(msg.message, msg.error ? 'err' : 'info');
      }
      render();
    }
  }
}

async function httpCall(method, path, body, authed){
  const url = state.httpBase.replace(/\/$/,'') + path;
  const headers = { 'Content-Type': 'application/json' };
  if(authed && state.token) headers['token'] = state.token;
  try{
    const res = await fetch(url, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
    const text = await res.text();
    let data = null;
    try{ data = text ? JSON.parse(text) : null; }catch(e){}
    return { ok: res.ok, status: res.status, data, raw: text };
  }catch(err){
    return { ok:false, status:0, data:null, raw: String(err) };
  }
}

function toast(text, kind){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='err' ? ' err' : (kind==='info' ? ' info' : ''));
  el.textContent = text;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .25s'; setTimeout(()=>el.remove(), 260); }, 3400);
}

function initials(s){ if(!s) return '?'; const parts = String(s).replace(/[^a-zA-Z0-9 ]/g,' ').trim().split(/\s+/); if(parts.length===1) return parts[0].slice(0,2).toUpperCase(); return (parts[0][0]+parts[1][0]).toUpperCase(); }
function truncate(s,n){ if(!s) return ''; s=String(s); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function formatTime(iso){ if(!iso) return ''; const d=new Date(iso); if(isNaN(d)) return ''; return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function escapeAttrText(s){ return escapeHtml(s); }

render();
</script>
