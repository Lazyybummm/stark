<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wire — messaging prototype</title>
<style>
  :root{
    --ink:#181A20;
    --paper:#EEF0F3;
    --panel:#FFFFFF;
    --line:#D9DCE2;
    --cobalt:#2C5FE8;
    --cobalt-dim:#E4EBFC;
    --sage:#3F8360;
    --amber:#B4750E;
    --muted:#71767E;
    --danger:#C43D3D;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{
    font-family:'Georgia', 'Iowan Old Style', serif;
    letter-spacing:-0.01em;
  }
  #app{
    height:100vh;
    display:flex;
    align-items:stretch;
    justify-content:center;
  }

  /* ---------- AUTH SCREEN ---------- */
  .auth-wrap{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .auth-card{
    width:380px;
    max-width:92vw;
    padding:40px 34px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
  }
  .auth-word{
    font-size:34px;
    font-weight:400;
    margin:0 0 4px 0;
  }
  .auth-sub{
    color:var(--muted);
    font-size:14px;
    margin:0 0 28px 0;
    line-height:1.5;
  }
  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:14px;
    background:#FAFBFC;
    color:var(--ink);
  }
  .field input:focus{
    outline:none;
    border-color:var(--cobalt);
    background:#fff;
  }
  .btn{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:none;
    background:var(--ink);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
  }
  .btn:hover{ background:#000; }
  .btn.secondary{
    background:transparent;
    color:var(--cobalt);
    border:1px solid var(--line);
  }
  .btn.secondary:hover{ background:var(--cobalt-dim); }
  .switch-line{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    color:var(--muted);
  }
  .switch-line a{
    color:var(--cobalt);
    cursor:pointer;
    text-decoration:none;
  }
  .auth-error{
    background:#FBEAEA;
    color:var(--danger);
    border-radius:8px;
    padding:9px 11px;
    font-size:12.5px;
    margin-bottom:14px;
  }

  /* ---------- MAIN SHELL ---------- */
  .shell{
    width:100%;
    height:100%;
    display:flex;
  }
  .sidebar{
    width:320px;
    min-width:320px;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
  }
  .side-head{
    padding:18px 18px 12px 18px;
    border-bottom:1px solid var(--line);
  }
  .side-head-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .brand{
    font-size:20px;
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand .dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--sage);
    display:inline-block;
  }
  .me{
    font-size:12px;
    color:var(--muted);
  }
  .logout{
    font-size:12px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
  .tabs{
    display:flex;
    gap:4px;
    background:#F1F2F5;
    padding:3px;
    border-radius:8px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:7px 0;
    font-size:12.5px;
    border-radius:6px;
    cursor:pointer;
    color:var(--muted);
    font-weight:600;
  }
  .tab.active{
    background:#fff;
    color:var(--ink);
    box-shadow:0 1px 2px rgba(0,0,0,0.08);
  }
  .new-row{
    padding:10px 18px;
    border-bottom:1px solid var(--line);
    display:flex;
    gap:8px;
  }
  .new-row input{
    flex:1;
    padding:8px 10px;
    border-radius:7px;
    border:1px solid var(--line);
    font-size:13px;
    background:#FAFBFC;
  }
  .new-row button{
    padding:8px 12px;
    border-radius:7px;
    border:none;
    background:var(--cobalt);
    color:#fff;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .list{
    flex:1;
    overflow-y:auto;
  }
  .row-item{
    padding:12px 18px;
    display:flex;
    gap:11px;
    align-items:center;
    cursor:pointer;
    border-bottom:1px solid #F0F1F4;
  }
  .row-item:hover{ background:#F7F8FA; }
  .row-item.active{ background:var(--cobalt-dim); }
  .avatar{
    width:40px;height:40px;border-radius:50%;
    background:var(--ink);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    font-weight:600;
    flex-shrink:0;
  }
  .avatar.group{ background:var(--amber); }
  .row-text{ flex:1; min-width:0; }
  .row-name{
    font-size:14px;
    font-weight:600;
    display:flex;
    justify-content:space-between;
    gap:6px;
  }
  .row-time{ font-weight:400; color:var(--muted); font-size:11px; }
  .row-preview{
    font-size:12.5px;
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;
  }
  .empty-list{
    padding:30px 18px;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
  }

  /* ---------- CHAT PANE ---------- */
  .chat-pane{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .chat-head{
    padding:14px 22px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel);
  }
  .chat-head-left{ display:flex; align-items:center; gap:11px; }
  .chat-head-name{ font-size:15px; font-weight:600; }
  .chat-head-sub{ font-size:12px; color:var(--muted); margin-top:1px; }
  .head-actions{ display:flex; gap:8px; }
  .icon-btn{
    border:1px solid var(--line);
    background:#fff;
    border-radius:7px;
    padding:6px 11px;
    font-size:12px;
    cursor:pointer;
    color:var(--ink);
  }
  .icon-btn:hover{ background:#F7F8FA; }
  .icon-btn.danger{ color:var(--danger); border-color:#F1D3D3; }

  .messages{
    flex:1;
    overflow-y:auto;
    padding:20px 26px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background:
      radial-gradient(circle at 1px 1px, #E3E5EA 1px, transparent 0) 0 0/22px 22px,
      var(--paper);
  }
  .bubble-row{ display:flex; }
  .bubble-row.mine{ justify-content:flex-end; }
  .bubble{
    max-width:62%;
    padding:9px 13px;
    border-radius:14px;
    font-size:14px;
    line-height:1.45;
    position:relative;
  }
  .bubble .sender-tag{
    font-size:11px;
    font-weight:700;
    margin-bottom:2px;
    color:var(--amber);
  }
  .bubble.theirs{
    background:#fff;
    border:1px solid var(--line);
    border-bottom-left-radius:4px;
  }
  .bubble.mine{
    background:var(--cobalt);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .meta{
    font-size:10.5px;
    margin-top:4px;
    display:flex;
    gap:4px;
    align-items:center;
    opacity:0.75;
  }
  .bubble.mine .meta{ justify-content:flex-end; }
  .system-line{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    margin:6px 0;
  }
  .typing-row{
    font-size:12.5px;
    color:var(--muted);
    padding:0 26px 8px 26px;
    font-style:italic;
  }
  .composer{
    display:flex;
    gap:10px;
    padding:14px 22px;
    border-top:1px solid var(--line);
    background:var(--panel);
  }
  .composer input{
    flex:1;
    padding:11px 14px;
    border-radius:20px;
    border:1px solid var(--line);
    font-size:14px;
    background:#F7F8FA;
  }
  .composer input:focus{ outline:none; border-color:var(--cobalt); background:#fff; }
  .send-btn{
    border:none;
    background:var(--ink);
    color:#fff;
    width:42px;height:42px;
    border-radius:50%;
    cursor:pointer;
    font-size:16px;
  }
  .send-btn:disabled{ background:#C7CAD1; cursor:default; }

  .placeholder-pane{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:var(--muted);
    gap:10px;
    text-align:center;
    padding:0 30px;
  }
  .placeholder-pane .display{ font-size:22px; color:var(--ink); }

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(20,22,26,0.4);
    display:flex; align-items:center; justify-content:center;
    z-index:30;
  }
  .modal{
    width:360px;
    max-width:90vw;
    background:#fff;
    border-radius:12px;
    padding:24px;
  }
  .modal h3{ margin:0 0 4px 0; font-size:17px; }
  .modal .modal-sub{ font-size:12.5px; color:var(--muted); margin-bottom:16px; }
  .modal-row{ margin-bottom:12px; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .member-list{ max-height:180px; overflow-y:auto; margin:10px 0; }
  .member-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:7px 0; font-size:13px; border-bottom:1px solid #F1F2F5;
  }
  .member-row .tag{
    font-size:10.5px; color:var(--amber); font-weight:700; margin-left:6px;
  }
  .member-row button{
    border:none; background:none; color:var(--danger);
    cursor:pointer; font-size:12px;
  }
  .toast-stack{
    position:fixed;
    bottom:20px; right:20px;
    display:flex; flex-direction:column; gap:8px;
    z-index:50;
  }
  .toast{
    background:var(--ink);
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    font-size:12.5px;
    max-width:280px;
    box-shadow:0 4px 14px rgba(0,0,0,0.18);
  }
  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:#D3D6DC; border-radius:8px; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
/* =========================================================================
   WIRE — React frontend that talks to your real backend via HTTP + WebSocket
   ========================================================================= */

const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ============================================================
// API & WS CONFIGURATION
// ============================================================
const API_BASE = 'http://localhost:8000';
const WS_URL = 'ws://localhost:8080';

// ============================================================
// HELPERS
// ============================================================
function fmtTime(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function initials(name) {
  if (!name) return '?';
  return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
}
function getToken() {
  return localStorage.getItem('token');
}
function getMyPhone() {
  return localStorage.getItem('myPhone');
}
function getMyName() {
  return localStorage.getItem('myName');
}

// ============================================================
// API FUNCTIONS
// ============================================================
async function apiCall(endpoint, method = 'POST', body = null, withToken = true) {
  const headers = { 'Content-Type': 'application/json' };
  if (withToken) {
    const token = getToken();
    if (token) headers['token'] = token;
  }
  const opts = { method, headers };
  if (body) opts.body = JSON.stringify(body);
  
  const res = await fetch(`${API_BASE}${endpoint}`, opts);
  const text = await res.text();
  try { return JSON.parse(text); } catch { return { raw: text }; }
}

async function login(phone, password) {
  return apiCall('/login', 'POST', { phone, password }, false);
}

async function signup(phone, password, name) {
  return apiCall('/signup', 'POST', { phone, password, name }, false);
}

async function getConversations() {
  return apiCall('/myconversation', 'POST', {}, true);
}

async function getMessages(conversationId) {
  return apiCall('/getmessages', 'POST', { conversationId }, true);
}

async function getGroupMessages(groupId) {
  return apiCall('/getgroupmessages', 'POST', { groupId }, true);
}

// ============================================================
// APP COMPONENT
// ============================================================
function App() {
  // --- Auth state ---
  const [me, setMe] = useState(null);
  const [screen, setScreen] = useState('login');
  const [authError, setAuthError] = useState('');
  const [isLoading, setIsLoading] = useState(false);

  // --- Data state ---
  const [conversations, setConversations] = useState([]);
  const [messagesCache, setMessagesCache] = useState({});
  const [groupMessagesCache, setGroupMessagesCache] = useState({});
  const [groups, setGroups] = useState([]);

  // --- UI state ---
  const [activeTab, setActiveTab] = useState('chats');
  const [activeChat, setActiveChat] = useState(null); // { type: 'convo'|'group', id }
  const [typingFrom, setTypingFrom] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [showNewGroup, setShowNewGroup] = useState(false);
  const [showMembers, setShowMembers] = useState(false);
  const [newChatPhone, setNewChatPhone] = useState('');
  const [newGroupName, setNewGroupName] = useState('');
  const [newGroupMembers, setNewGroupMembers] = useState('');
  const [draft, setDraft] = useState('');
  const typingTimeout = useRef(null);
  const messagesEndRef = useRef(null);
  const wsRef = useRef(null);
  const reconnectTimeout = useRef(null);

  // --- Toast system ---
  function pushToast(text) {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, text }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }

  // --- WebSocket connection with reconnect ---
  const connectWebSocket = useCallback(() => {
    const token = getToken();
    if (!token) {
      console.log('No token, skipping WebSocket connection');
      return null;
    }

    if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
      return wsRef.current;
    }

    const ws = new WebSocket(WS_URL);
    wsRef.current = ws;

    ws.onopen = () => {
      console.log('WebSocket connected');
      pushToast('Connected to server');
      ws.send(JSON.stringify({ event: 'auth', data: token }));
    };

    ws.onmessage = (event) => {
      let msg = null;
      let isJson = false;
      
      try {
        msg = JSON.parse(event.data);
        isJson = true;
        console.log('WS message (JSON):', msg);
      } catch (e) {
        console.log('WS message (plain text):', event.data);
        if (event.data === 'connected') {
          pushToast('Connected to WebSocket server');
        }
        return;
      }

      if (!isJson) return;

      // --- Handle JSON messages ---

      // Auth success - load conversations and groups
      if (msg.event === 'auth_success') {
        pushToast('Authenticated with WebSocket');
        loadConversations();
        // Groups will be loaded via group-data event
      }

      // Auth failed
      if (msg.event === 'auth' && msg.message) {
        pushToast('Auth failed: ' + msg.message);
        localStorage.removeItem('token');
        setMe(null);
        ws.close();
      }

      // Group data from auth
      if (msg.event === 'group-data') {
        const groupData = msg.message || msg.data || [];
        if (Array.isArray(groupData) && groupData.length > 0) {
          setGroups(groupData);
          // Update in-memory groups cache
          groupData.forEach(g => {
            if (!groups.some(existing => existing.id === g.id)) {
              setGroups(prev => [...prev, g]);
            }
          });
        }
      }

      // Incoming 1-on-1 message
      if (msg.event === 'chat') {
        const messageData = msg.content || msg.messageResult || msg.data;
        if (messageData) {
          // Determine conversation ID
          const convId = messageData.conversation_id;
          if (convId) {
            // Check if message already exists
            setMessagesCache(prev => {
              const existing = prev[convId] || [];
              if (existing.find(m => m.id === messageData.id)) return prev;
              return { ...prev, [convId]: [...existing, messageData] };
            });
            
            // Update conversation list
            setConversations(prev => {
              const existing = prev.find(c => c.id === convId);
              if (existing) {
                return prev.map(c => 
                  c.id === convId ? { ...c, last_message: messageData.content, last_message_at: messageData.created_at } : c
                );
              }
              // New conversation - add it
              const myPhone = getMyPhone();
              const otherPhone = messageData.sender_phone === myPhone ? messageData.receiver_phone : messageData.sender_phone;
              return [
                {
                  id: convId,
                  user1_phone: messageData.sender_phone === myPhone ? myPhone : messageData.sender_phone,
                  user2_phone: messageData.sender_phone === myPhone ? messageData.receiver_phone : messageData.sender_phone,
                  other_user_name: otherPhone,
                  other_user_phone: otherPhone,
                  last_message: messageData.content,
                  last_message_at: messageData.created_at
                },
                ...prev.filter(c => c.id !== convId)
              ];
            });

            // ✅ Auto-mark as seen if the message is from someone else and we're in this chat
            const myPhone = getMyPhone();
            if (messageData.sender_phone !== myPhone && activeChat?.type === 'convo' && activeChat.id === convId) {
              const conv = conversations.find(c => c.id === convId);
              const otherPhone = conv ? (conv.user1_phone === myPhone ? conv.user2_phone : conv.user1_phone) : null;
              if (otherPhone) {
                setTimeout(() => markSeen(messageData.id, otherPhone), 500);
              }
            }
          }
        }
      }

      // Incoming group message
      if (msg.event === 'group message recieved' || msg.event === 'group_message') {
        const messageData = msg.message || msg.data;
        if (messageData) {
          const groupId = messageData.group_id;
          if (groupId) {
            // Check if message already exists
            setGroupMessagesCache(prev => {
              const existing = prev[groupId] || [];
              if (existing.find(m => m.id === messageData.id)) return prev;
              return { ...prev, [groupId]: [...existing, messageData] };
            });
          }
        }
      }

      // ✅ Message status updates (sent/delivered)
      if (msg.status === 'sent' || msg.status === 'delivered') {
        if (msg.tempid) {
          // Find the message by tempId in 1-on-1 messages
          for (const convId in messagesCache) {
            const idx = messagesCache[convId].findIndex(m => m.tempId === msg.tempid);
            if (idx !== -1) {
              setMessagesCache(prev => {
                const updated = [...prev[convId]];
                updated[idx] = { ...updated[idx], id: msg.correctid, status: msg.status, tempId: null };
                return { ...prev, [convId]: updated };
              });
              break;
            }
          }
          // Also check group messages
          for (const groupId in groupMessagesCache) {
            const idx = groupMessagesCache[groupId].findIndex(m => m.tempId === msg.tempid);
            if (idx !== -1) {
              setGroupMessagesCache(prev => {
                const updated = [...prev[groupId]];
                updated[idx] = { ...updated[idx], id: msg.correctid, status: msg.status, tempId: null };
                return { ...prev, [groupId]: updated };
              });
              break;
            }
          }
        }
      }

      // ✅ Seen status (sender receives this)
      if (msg.event === 'seen') {
        const messageId = msg.messageId;
        // Update the message status to 'seen' in cache
        for (const convId in messagesCache) {
          const idx = messagesCache[convId].findIndex(m => m.id === messageId);
          if (idx !== -1) {
            setMessagesCache(prev => {
              const updated = [...prev[convId]];
              updated[idx] = { ...updated[idx], status: 'seen' };
              return { ...prev, [convId]: updated };
            });
            break;
          }
        }
      }

      // Typing indicator
      if (msg.event === 'typing') {
        setTypingFrom(msg.sender_phone);
        clearTimeout(typingTimeout.current);
        typingTimeout.current = setTimeout(() => setTypingFrom(null), 3000);
      }

      // Group events
      if (msg.message === 'room created succesfully') {
        pushToast('Group created successfully!');
        loadConversations();
      }
      if (msg.event === 'added to a room') {
        pushToast(`You were added to "${msg.groupName || 'a group'}"`);
        loadConversations();
      }
      if (msg.event === 'user added' || msg.message === 'user added to the room') {
        pushToast('Member added to group');
        loadConversations();
      }
      if (msg.event === 'left-group' || msg.event === 'user left the group') {
        pushToast('You left the group');
        loadConversations();
        setActiveChat(null);
      }
      if (msg.event === 'removed from the group') {
        pushToast('You were removed from the group');
        loadConversations();
        setActiveChat(null);
      }
      if (msg.event === 'notify others' && msg.message) {
        // System notification - ignore or show quietly
      }
      if (msg.event === 'error') {
        pushToast('Error: ' + (msg.err_msg || msg.message));
      }
      if (msg.event === 'removal success') {
        pushToast('User removed successfully');
        loadConversations();
      }
      if (msg.event === 'unathorized action') {
        pushToast('Unauthorized: ' + (msg.message || ''));
      }
    };

    ws.onclose = () => {
      console.log('WebSocket disconnected');
      pushToast('Disconnected from server');
      // Attempt reconnect after 5 seconds
      if (reconnectTimeout.current) clearTimeout(reconnectTimeout.current);
      reconnectTimeout.current = setTimeout(() => {
        console.log('Attempting to reconnect...');
        connectWebSocket();
      }, 5000);
    };

    ws.onerror = (error) => {
      console.error('WS error:', error);
      pushToast('WebSocket error');
    };

    return ws;
  }, []);

  // --- Load conversations ---
  const loadConversations = useCallback(async () => {
    try {
      const data = await getConversations();
      console.log('Conversations:', data);
      
      // Handle different response formats
      if (data && data.success && data.conversations) {
        setConversations(data.conversations);
      } else if (Array.isArray(data)) {
        setConversations(data);
      } else if (data && data.raw && typeof data.raw === 'string' && data.raw.includes('no active conversations')) {
        setConversations([]);
      } else if (typeof data === 'string' && data.includes('no active conversations')) {
        setConversations([]);
      } else {
        // Try to parse as array if it's an object with numeric keys
        if (data && typeof data === 'object' && !Array.isArray(data)) {
          const arr = Object.values(data);
          if (arr.length > 0 && arr[0] && typeof arr[0] === 'object') {
            setConversations(arr);
          } else {
            setConversations([]);
          }
        } else {
          setConversations([]);
        }
      }
    } catch (error) {
      console.error('Load conversations error:', error);
      setConversations([]);
    }
  }, []);

  // --- Load messages for a conversation ---
  const loadMessages = useCallback(async (conversationId, isGroup = false) => {
    if (!conversationId) return null;
    try {
      let data;
      if (isGroup) {
        data = await getGroupMessages(conversationId);
        if (data && data.success && data.messages) {
          setGroupMessagesCache(prev => ({ ...prev, [conversationId]: data.messages }));
        } else if (Array.isArray(data)) {
          setGroupMessagesCache(prev => ({ ...prev, [conversationId]: data }));
        }
      } else {
        data = await getMessages(conversationId);
        if (data && data.success && data.messages) {
          setMessagesCache(prev => ({ ...prev, [conversationId]: data.messages }));
        } else if (Array.isArray(data)) {
          setMessagesCache(prev => ({ ...prev, [conversationId]: data }));
        }
      }
      
      // ✅ Mark the most recent received message as seen
      const msgs = isGroup ? 
        (data?.messages || (Array.isArray(data) ? data : [])) : 
        (data?.messages || (Array.isArray(data) ? data : []));
      
      if (msgs && msgs.length > 0) {
        const myPhone = getMyPhone();
        let lastReceivedMsg = null;
        for (let i = msgs.length - 1; i >= 0; i--) {
          if (msgs[i].sender_phone !== myPhone && msgs[i].status !== 'seen') {
            lastReceivedMsg = msgs[i];
            break;
          }
        }
        if (lastReceivedMsg && lastReceivedMsg.id && !isGroup) {
          // Find the other phone number for the conversation
          const conv = conversations.find(c => c.id === conversationId);
          if (conv) {
            const otherPhone = conv.user1_phone === myPhone ? conv.user2_phone : conv.user1_phone;
            if (otherPhone) {
              markSeen(lastReceivedMsg.id, otherPhone);
            }
          }
        }
      }
      
      return data;
    } catch (error) {
      console.error('Load messages error:', error);
      return null;
    }
  }, [conversations]);

  // --- Open a conversation ---
  const openConversation = useCallback(async (id, type) => {
    if (!id) return;
    const isGroup = type === 'group';
    setActiveChat({ type, id });
    await loadMessages(id, isGroup);
  }, [loadMessages]);

  // --- Send 1-on-1 message ---
  const sendDirectMessage = useCallback((text) => {
    if (!text.trim() || !activeChat || activeChat.type !== 'convo') return;
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      pushToast('WebSocket not connected');
      return;
    }

    const tempId = 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    const convId = activeChat.id;
    const myPhone = getMyPhone();
    
    // Determine the receiver phone number
    let receiverPhone = null;
    if (convId && !convId.startsWith('temp_')) {
      const conv = conversations.find(c => c.id === convId);
      if (conv) {
        receiverPhone = conv.user1_phone === myPhone ? conv.user2_phone : conv.user1_phone;
      }
    } else {
      // For temp conversations, get from the conversation
      const conv = conversations.find(c => c.id === convId);
      if (conv) {
        receiverPhone = conv.user1_phone === myPhone ? conv.user2_phone : conv.user1_phone;
      }
    }

    if (!receiverPhone) {
      pushToast('Could not determine recipient');
      return;
    }

    // Optimistic UI
    const msg = { 
      id: tempId, 
      tempId, 
      sender_phone: myPhone, 
      receiver_phone: receiverPhone,
      content: text, 
      created_at: new Date().toISOString(), 
      status: 'sending',
      conversation_id: convId
    };
    
    // If it's a temp conversation, we need to update the conversation ID after the message is sent
    const isTempConv = convId.startsWith('temp_');
    
    setMessagesCache(prev => ({
      ...prev,
      [convId]: [...(prev[convId] || []), msg]
    }));

    // Send via WebSocket
    ws.send(JSON.stringify({
      event: 'chat',
      data: {
        sender_phonenum: myPhone,
        reciever_phonenum: receiverPhone,
        content: text,
        tempid: tempId
      }
    }));

    setDraft('');
    
    // If temp conversation, the backend will create the conversation
    // The response will contain the correct conversation ID
  }, [activeChat, conversations]);

  // --- Send group message ---
  const sendGroupMessage = useCallback((text) => {
    if (!text.trim() || !activeChat || activeChat.type !== 'group') return;
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      pushToast('WebSocket not connected');
      return;
    }

    const tempId = 'temp_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
    const groupId = activeChat.id;
    const myPhone = getMyPhone();

    const msg = {
      id: tempId,
      tempId,
      sender_phone: myPhone,
      group_id: groupId,
      content: text,
      created_at: new Date().toISOString(),
      status: 'sending'
    };
    setGroupMessagesCache(prev => ({
      ...prev,
      [groupId]: [...(prev[groupId] || []), msg]
    }));

    ws.send(JSON.stringify({
      event: 'sendtoroom',
      data: {
        roomId: groupId,
        sender_phone: myPhone,
        message: text,
        tempmsgId: tempId
      }
    }));

    setDraft('');
  }, [activeChat]);

  // --- Start a new conversation ---
  const startConversation = useCallback((phone) => {
    if (!phone) {
      pushToast('Please enter a phone number');
      return;
    }
    
    const myPhone = getMyPhone();
    if (phone === myPhone) {
      pushToast('You cannot chat with yourself');
      return;
    }
    
    // Check if conversation already exists
    const existingConvo = conversations.find(c => 
      (c.user1_phone === myPhone && c.user2_phone === phone) ||
      (c.user1_phone === phone && c.user2_phone === myPhone)
    );
    
    if (existingConvo) {
      openConversation(existingConvo.id, 'convo');
      pushToast('Conversation already exists');
      return;
    }
    
    // Create temporary conversation
    const tempId = 'temp_' + Date.now();
    const newConv = {
      id: tempId,
      user1_phone: myPhone,
      user2_phone: phone,
      other_user_name: phone,
      other_user_phone: phone,
      last_message: 'Start a conversation',
      last_message_at: new Date().toISOString()
    };
    
    setConversations(prev => [newConv, ...prev]);
    setMessagesCache(prev => ({ ...prev, [tempId]: [] }));
    setActiveChat({ type: 'convo', id: tempId });
    setNewChatPhone('');
    
    pushToast(`Starting conversation with ${phone}...`);
    
    // Focus on message input
    setTimeout(() => {
      const input = document.querySelector('.composer input');
      if (input) input.focus();
    }, 100);
  }, [conversations, openConversation]);

  // --- Create group ---
  const createGroup = useCallback(() => {
    if (!newGroupName.trim()) {
      pushToast('Please enter a group name');
      return;
    }
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      pushToast('WebSocket not connected');
      return;
    }

    const members = newGroupMembers.split(',').map(p => p.trim()).filter(p => p);
    ws.send(JSON.stringify({
      event: 'create-room',
      data: {
        sender_phone: getMyPhone(),
        group_name: newGroupName.trim(),
        participants: members,
        tempid: 'room_' + Date.now()
      }
    }));

    setShowNewGroup(false);
    setNewGroupName('');
    setNewGroupMembers('');
    pushToast('Creating group...');
  }, [newGroupName, newGroupMembers]);

  // --- Add member to group ---
  const addMember = useCallback((groupId, phone) => {
    if (!phone) {
      pushToast('Please enter a phone number');
      return;
    }
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      pushToast('WebSocket not connected');
      return;
    }
    ws.send(JSON.stringify({
      event: 'addtoroom',
      data: {
        roomId: groupId,
        receiver_phone: phone,
        sender_phone: getMyPhone()
      }
    }));
    pushToast(`Adding ${phone}...`);
  }, []);

  // --- Leave group ---
  const leaveGroup = useCallback((groupId) => {
    if (!confirm('Are you sure you want to leave this group?')) return;
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      pushToast('WebSocket not connected');
      return;
    }
    ws.send(JSON.stringify({
      event: 'leaveroom',
      data: {
        sender_phone: getMyPhone(),
        roomId: groupId
      }
    }));
  }, []);

  // --- Delete group ---
  const deleteGroup = useCallback((groupId) => {
    if (!confirm('Delete this group permanently? This action cannot be undone.')) return;
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      pushToast('WebSocket not connected');
      return;
    }
    ws.send(JSON.stringify({
      event: 'delete-group',
      data: { groupId }
    }));
    pushToast('Deleting group...');
  }, []);

  // --- Mark message as seen ---
  const markSeen = useCallback((messageId, otherPhone) => {
    if (!messageId || !otherPhone) return;
    const ws = wsRef.current;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    
    ws.send(JSON.stringify({
      event: 'seen',
      data: { 
        messageId: messageId, 
        rec_phone: otherPhone 
      }
    }));
  }, []);

  // --- Login ---
  const handleLogin = useCallback(async (phone, password) => {
    setAuthError('');
    setIsLoading(true);
    try {
      const data = await login(phone, password);
      if (data && data.token) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('myPhone', phone);
        localStorage.setItem('myName', data.name || phone);
        setMe({ phone, name: data.name || phone });
        // Let WebSocket connect after login
        setTimeout(() => connectWebSocket(), 300);
        pushToast('Login successful!');
      } else {
        setAuthError(data?.message || data?.raw || 'Login failed');
      }
    } catch (error) {
      setAuthError('Network error: ' + error.message);
    }
    setIsLoading(false);
  }, [connectWebSocket]);

  // --- Signup ---
  const handleSignup = useCallback(async (phone, password, name) => {
    setAuthError('');
    setIsLoading(true);
    try {
      const data = await signup(phone, password, name);
      if (data && data.message) {
        pushToast('Account created! Please login.');
        setScreen('login');
      } else {
        setAuthError(data?.error || data?.message || 'Signup failed');
      }
    } catch (error) {
      setAuthError('Network error: ' + error.message);
    }
    setIsLoading(false);
  }, []);

  // --- Logout ---
  const handleLogout = useCallback(() => {
    localStorage.removeItem('token');
    localStorage.removeItem('myPhone');
    localStorage.removeItem('myName');
    if (wsRef.current) {
      wsRef.current.close();
      wsRef.current = null;
    }
    if (reconnectTimeout.current) {
      clearTimeout(reconnectTimeout.current);
      reconnectTimeout.current = null;
    }
    setMe(null);
    setActiveChat(null);
    setConversations([]);
    setMessagesCache({});
    setGroupMessagesCache({});
    setGroups([]);
    pushToast('Logged out');
  }, []);

  // --- Check existing session on mount ---
  useEffect(() => {
    const token = getToken();
    const phone = getMyPhone();
    const name = getMyName();
    if (token && phone) {
      setMe({ phone, name: name || phone });
      // Connect WebSocket after a small delay
      setTimeout(() => connectWebSocket(), 500);
    }
    
    return () => {
      if (reconnectTimeout.current) {
        clearTimeout(reconnectTimeout.current);
      }
    };
  }, []);

  // --- Auto-scroll to bottom when messages change ---
  useEffect(() => {
    if (messagesEndRef.current) {
      messagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
    }
  }, [messagesCache, groupMessagesCache, activeChat]);

  // ============================================================
  // RENDER: AUTH
  // ============================================================
  if (!me) {
    return (
      <div className="auth-wrap">
        <div className="auth-card">
          <p className="auth-word display">Wire</p>
          <p className="auth-sub">Phone-number messaging with real backend.</p>
          {authError && <div className="auth-error">{authError}</div>}
          {screen === 'login' ? (
            <LoginForm 
              onSubmit={handleLogin} 
              isLoading={isLoading} 
            />
          ) : (
            <SignupForm 
              onSubmit={handleSignup} 
              isLoading={isLoading} 
            />
          )}
          <p className="switch-line">
            {screen === 'login' ? (
              <>New here? <a onClick={() => { setScreen('signup'); setAuthError(''); }}>Create an account</a></>
            ) : (
              <>Already registered? <a onClick={() => { setScreen('login'); setAuthError(''); }}>Log in</a></>
            )}
          </p>
        </div>
      </div>
    );
  }

  // ============================================================
  // RENDER: MAIN
  // ============================================================
  const myConvos = conversations.filter(c => 
    c && (c.user1_phone === getMyPhone() || c.user2_phone === getMyPhone())
  );
  const myGroups = groups.filter(g => 
    g && g.participants && g.participants.includes(getMyPhone())
  );

  let activeConvo = null, activeGroup = null;
  let activeMsgs = [];
  
  if (activeChat?.type === 'convo') {
    activeConvo = conversations.find(c => c && c.id === activeChat.id);
    activeMsgs = messagesCache[activeChat.id] || [];
  } else if (activeChat?.type === 'group') {
    activeGroup = groups.find(g => g && g.id === activeChat.id);
    activeMsgs = groupMessagesCache[activeChat.id] || [];
  }

  const getOtherPhone = (conv) => {
    if (!conv) return '';
    const myPhone = getMyPhone();
    if (conv.user1_phone === myPhone) return conv.user2_phone;
    return conv.user1_phone;
  };

  const getOtherName = (conv) => {
    if (!conv) return 'Unknown';
    return conv.other_user_name || conv.other_user_phone || 'Unknown';
  };

  const isTempConv = activeChat && activeChat.type === 'convo' && 
    typeof activeChat.id === 'string' && activeChat.id.startsWith('temp_');

  return (
    <div className="shell">
      <div className="sidebar">
        <div className="side-head">
          <div className="side-head-row">
            <div className="brand"><span className="dot"></span><span className="display">Wire</span></div>
            <button className="logout" onClick={handleLogout}>Log out</button>
          </div>
          <div className="me">{me.name || me.phone} · {me.phone}</div>
        </div>
        <div style={{padding:"12px 18px 0 18px"}}>
          <div className="tabs">
            <div className={"tab" + (activeTab === "chats" ? " active" : "")} onClick={() => setActiveTab("chats")}>Chats</div>
            <div className={"tab" + (activeTab === "groups" ? " active" : "")} onClick={() => setActiveTab("groups")}>Groups</div>
          </div>
        </div>

        {activeTab === "chats" ? (
          <div className="new-row" style={{marginTop:12}}>
            <input
              placeholder="Start chat by phone number"
              value={newChatPhone}
              onChange={e => setNewChatPhone(e.target.value)}
              onKeyDown={e => e.key === "Enter" && startConversation(newChatPhone.trim())}
            />
            <button onClick={() => startConversation(newChatPhone.trim())}>Start</button>
          </div>
        ) : (
          <div className="new-row" style={{marginTop:12}}>
            <button style={{flex:1}} onClick={() => setShowNewGroup(true)}>+ New group</button>
          </div>
        )}

        <div className="list">
          {activeTab === "chats" && (
            myConvos.length === 0 ? (
              <div className="empty-list">No conversations yet. Start one above.</div>
            ) : myConvos.map(c => {
              if (!c) return null;
              const otherPhone = getOtherPhone(c);
              const otherName = getOtherName(c);
              const msgs = messagesCache[c.id] || [];
              const last = msgs[msgs.length - 1];
              const isActive = activeChat?.type === "convo" && activeChat.id === c.id;
              const isTemp = c.id && c.id.startsWith('temp_');
              return (
                <div key={c.id}
                     className={"row-item" + (isActive ? " active" : "")}
                     onClick={() => {
                       if (isTemp) {
                         setActiveChat({ type: 'convo', id: c.id });
                         setNewChatPhone('');
                       } else {
                         openConversation(c.id, 'convo');
                       }
                     }}>
                  <div className="avatar">{initials(otherName)}</div>
                  <div className="row-text">
                    <div className="row-name">
                      <span>{otherName} {isTemp && <span style={{fontSize:10, color:'var(--amber)'}}>new</span>}</span>
                      <span className="row-time">{last ? fmtTime(last.created_at) : ""}</span>
                    </div>
                    <div className="row-preview">
                      {last ? (last.sender_phone === getMyPhone() ? "You: " : "") + (last.content || '') : "Say hello 👋"}
                    </div>
                  </div>
                </div>
              );
            })
          )}

          {activeTab === "groups" && (
            myGroups.length === 0 ? (
              <div className="empty-list">No groups yet. Create one to get started.</div>
            ) : myGroups.map(g => {
              if (!g) return null;
              const msgs = groupMessagesCache[g.id] || [];
              const last = msgs[msgs.length - 1];
              const isActive = activeChat?.type === "group" && activeChat.id === g.id;
              return (
                <div key={g.id}
                     className={"row-item" + (isActive ? " active" : "")}
                     onClick={() => openConversation(g.id, 'group')}>
                  <div className="avatar group">{initials(g.group_name || 'Group')}</div>
                  <div className="row-text">
                    <div className="row-name">
                      <span>{g.group_name || 'Group'}</span>
                      <span className="row-time">{last ? fmtTime(last.created_at) : ""}</span>
                    </div>
                    <div className="row-preview">
                      {last ? (last.sender_phone === getMyPhone() ? "You: " : (last.sender_name || last.sender_phone) + ": ") + (last.content || '') : `${g.participants ? g.participants.length : 0} members`}
                    </div>
                  </div>
                </div>
              );
            })
          )}
        </div>
      </div>

      {activeChat && (activeConvo || activeGroup) ? (
        <div className="chat-pane">
          <div className="chat-head">
            <div className="chat-head-left">
              <div className={"avatar" + (activeGroup ? " group" : "")}>
                {initials(activeGroup ? (activeGroup.group_name || 'Group') : getOtherName(activeConvo))}
              </div>
              <div>
                <div className="chat-head-name">
                  {activeGroup ? (activeGroup.group_name || 'Group') : getOtherName(activeConvo)}
                  {isTempConv && <span style={{fontSize:12, color:'var(--amber)', marginLeft:8}}>new</span>}
                </div>
                <div className="chat-head-sub">
                  {activeGroup
                    ? `${activeGroup.participants ? activeGroup.participants.length : 0} members${activeGroup.admin_phone === getMyPhone() ? " · you're admin" : ""}`
                    : isTempConv ? "Send a message to start the conversation" : "online"}
                </div>
              </div>
            </div>
            <div className="head-actions">
              {activeGroup && <button className="icon-btn" onClick={() => setShowMembers(true)}>Members</button>}
              {activeGroup && activeGroup.admin_phone === getMyPhone() && (
                <button className="icon-btn danger" onClick={() => deleteGroup(activeGroup.id)}>Delete</button>
              )}
              {activeGroup && <button className="icon-btn danger" onClick={() => leaveGroup(activeGroup.id)}>Leave</button>}
            </div>
          </div>

          <div className="messages">
            <div className="system-line">
              {activeGroup ? `You are in "${activeGroup.group_name || 'Group'}"` : isTempConv ? "Say hello to start the conversation!" : "Start of conversation"}
            </div>
            {activeMsgs && activeMsgs.map(m => {
              if (!m) return null;
              const isMine = m.sender_phone === getMyPhone();
              const messageId = m.id || m.tempId || 'msg_' + Date.now();
              return (
                <div key={messageId} className={"bubble-row" + (isMine ? " mine" : "")}>
                  <div className={"bubble" + (isMine ? " mine" : " theirs")}>
                    {activeGroup && !isMine && m.sender_name && (
                      <div className="sender-tag">{m.sender_name}</div>
                    )}
                    {m.content}
                    <div className="meta">
                      <span>{fmtTime(m.created_at)}</span>
                      {isMine && !activeGroup && (
                        <span className="status-icon" style={{fontSize: '12px'}}>
                          {m.status === 'seen' ? '✓✓' : m.status === 'delivered' ? '✓✓' : m.status === 'sending' ? '◌' : '✓'}
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
            <div ref={messagesEndRef} />
          </div>

          {typingFrom && (activeConvo?.user1_phone === typingFrom || activeConvo?.user2_phone === typingFrom || (activeGroup && activeGroup.participants && activeGroup.participants.includes(typingFrom))) && (
            <div className="typing-row">{typingFrom} is typing…</div>
          )}

          <div className="composer">
            <input
              placeholder={activeGroup ? "Message the group" : isTempConv ? "Type your first message..." : "Type a message"}
              value={draft}
              onChange={e => {
                setDraft(e.target.value);
                const ws = wsRef.current;
                if (ws && ws.readyState === WebSocket.OPEN && e.target.value.trim()) {
                  let target = null;
                  if (activeGroup) {
                    target = activeGroup.id;
                  } else if (activeConvo) {
                    target = getOtherPhone(activeConvo);
                  }
                  if (target) {
                    ws.send(JSON.stringify({
                      event: 'typing',
                      data: {
                        sender_phone: getMyPhone(),
                        reciever_phonenum: target
                      }
                    }));
                  }
                }
              }}
              onKeyDown={e => {
                if (e.key === "Enter" && !e.shiftKey) {
                  e.preventDefault();
                  if (activeGroup) {
                    sendGroupMessage(draft);
                  } else {
                    sendDirectMessage(draft);
                  }
                }
              }}
            />
            <button
              className="send-btn"
              disabled={!draft.trim()}
              onClick={() => {
                if (activeGroup) {
                  sendGroupMessage(draft);
                } else {
                  sendDirectMessage(draft);
                }
              }}
            >➤</button>
          </div>
        </div>
      ) : (
        <div className="placeholder-pane">
          <p className="display">Pick a conversation</p>
          <p style={{maxWidth:320, fontSize:13.5}}>Choose a chat or group on the left, or start a new one.</p>
        </div>
      )}

      {/* New Group Modal */}
      {showNewGroup && (
        <div className="overlay" onClick={() => setShowNewGroup(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>New group</h3>
            <p className="modal-sub">You'll be the admin. You can add members after creation.</p>
            <div className="modal-row">
              <input 
                placeholder="Group name" 
                value={newGroupName} 
                onChange={e => setNewGroupName(e.target.value)}
                style={{width:"100%", padding:"10px 12px", borderRadius:8, border:"1px solid var(--line)", fontSize:14}} 
              />
            </div>
            <div className="modal-row">
              <input 
                placeholder="Member phone numbers (comma separated)" 
                value={newGroupMembers} 
                onChange={e => setNewGroupMembers(e.target.value)}
                style={{width:"100%", padding:"10px 12px", borderRadius:8, border:"1px solid var(--line)", fontSize:14}} 
              />
            </div>
            <div className="modal-actions">
              <button className="btn secondary" onClick={() => setShowNewGroup(false)} style={{flex:1}}>Cancel</button>
              <button className="btn" onClick={createGroup} style={{flex:1}}>Create</button>
            </div>
          </div>
        </div>
      )}

      {/* Members Modal */}
      {showMembers && activeGroup && (
        <div className="overlay" onClick={() => setShowMembers(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h3>{activeGroup.group_name || 'Group'}</h3>
            <p className="modal-sub">{activeGroup.participants ? activeGroup.participants.length : 0} members</p>
            <div className="member-list">
              {activeGroup.participants && activeGroup.participants.map(p => (
                <div className="member-row" key={p}>
                  <span>
                    {p === getMyPhone() ? 'You' : p}
                    {activeGroup.admin_phone === p && <span className="tag">ADMIN</span>}
                  </span>
                  {activeGroup.admin_phone === getMyPhone() && p !== getMyPhone() && (
                    <button onClick={() => {
                      const ws = wsRef.current;
                      if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({
                          event: 'removeuser',
                          data: {
                            roomId: activeGroup.id,
                            receiver_phone: p,
                            sender_phone: getMyPhone()
                          }
                        }));
                        pushToast(`Removing ${p}...`);
                      }
                    }}>Remove</button>
                  )}
                </div>
              ))}
            </div>
            {activeGroup.admin_phone === getMyPhone() && (
              <div className="modal-row" style={{display:"flex", gap:8, marginTop:14}}>
                <input 
                  placeholder="Add member by phone" 
                  id="addMemberInput"
                  style={{flex:1, padding:"9px 10px", borderRadius:7, border:"1px solid var(--line)", fontSize:13}} 
                />
                <button className="icon-btn" onClick={() => {
                  const input = document.getElementById('addMemberInput');
                  if (input) {
                    addMember(activeGroup.id, input.value.trim());
                    input.value = '';
                  }
                }}>Add</button>
              </div>
            )}
            <div className="modal-actions">
              <button className="btn secondary" onClick={() => setShowMembers(false)} style={{flex:1}}>Close</button>
            </div>
          </div>
        </div>
      )}

      <div className="toast-stack">
        {toasts.map(t => <div key={t.id} className="toast">{t.text}</div>)}
      </div>
    </div>
  );
}

// ============================================================
// AUTH COMPONENTS
// ============================================================
function LoginForm({ onSubmit, isLoading }) {
  const [phone, setPhone] = useState('');
  const [password, setPassword] = useState('');
  return (
    <div>
      <div className="field">
        <label>Phone number</label>
        <input 
          value={phone} 
          onChange={e => setPhone(e.target.value)} 
          placeholder="+919876543210" 
        />
      </div>
      <div className="field">
        <label>Password</label>
        <input 
          type="password" 
          value={password} 
          onChange={e => setPassword(e.target.value)}
          onKeyDown={e => e.key === "Enter" && onSubmit(phone.trim(), password)} 
          placeholder="••••••" 
        />
      </div>
      <button className="btn" onClick={() => onSubmit(phone.trim(), password)} disabled={isLoading}>
        {isLoading ? 'Logging in...' : 'Log in'}
      </button>
    </div>
  );
}

function SignupForm({ onSubmit, isLoading }) {
  const [phone, setPhone] = useState('');
  const [password, setPassword] = useState('');
  const [name, setName] = useState('');
  return (
    <div>
      <div className="field">
        <label>Full name</label>
        <input 
          value={name} 
          onChange={e => setName(e.target.value)} 
          placeholder="Your name" 
        />
      </div>
      <div className="field">
        <label>Phone number</label>
        <input 
          value={phone} 
          onChange={e => setPhone(e.target.value)} 
          placeholder="+919876543210" 
        />
      </div>
      <div className="field">
        <label>Password</label>
        <input 
          type="password" 
          value={password} 
          onChange={e => setPassword(e.target.value)}
          onKeyDown={e => e.key === "Enter" && onSubmit(phone.trim(), password, name.trim())} 
          placeholder="Choose a password" 
        />
      </div>
      <button className="btn" onClick={() => onSubmit(phone.trim(), password, name.trim())} disabled={isLoading}>
        {isLoading ? 'Creating...' : 'Create account'}
      </button>
    </div>
  );
}

// ============================================================
// RENDER
// ============================================================
ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
