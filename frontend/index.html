<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💬 Real Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0f0f13;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #1a1a1e;
            border-radius: 24px;
            padding: 24px 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            border: 1px solid #2c2c32;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #2a2a30;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #88889a;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot.online {
            background: #2ecc71;
            box-shadow: 0 0 8px #2ecc7166;
        }

        .dot.offline {
            background: #63637a;
        }

        /* USER INFO */
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 8px 0;
            flex-shrink: 0;
            gap: 8px;
        }

        .user-info .phone-display {
            color: #aaaabc;
            font-size: 13px;
        }

        .user-info .badge {
            background: #2d2d35;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 11px;
            color: #aaa;
        }

        /* AUTH SECTION */
        #authSection {
            flex-shrink: 0;
            padding: 10px 0 4px 0;
        }

        #authSection .form-group {
            margin-bottom: 10px;
        }

        #authSection label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: #9a9aae;
            margin-bottom: 3px;
        }

        #authSection input {
            width: 100%;
            padding: 10px 14px;
            background: #121217;
            border: 1px solid #2c2c34;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            transition: 0.2s;
        }

        #authSection input:focus {
            outline: none;
            border-color: #6c5ce7;
            background: #18181e;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-row .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            background: #6c5ce7;
            color: white;
        }
        .btn-primary:hover {
            background: #5a4bd1;
        }

        .btn-success {
            background: #00b894;
            color: white;
        }
        .btn-success:hover {
            background: #00a381;
        }

        .btn-danger {
            background: #e17055;
            color: white;
        }
        .btn-danger:hover {
            background: #d63031;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #3a3a42;
            color: #ccc;
        }
        .btn-outline:hover {
            background: #22222a;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
            width: auto;
        }

        /* MESSAGES AREA */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 4px 8px 4px;
            margin: 6px 0 8px 0;
            background: #0b0b0f;
            border-radius: 14px;
            border: 1px solid #1e1e24;
            min-height: 0;
        }

        .messages-area .empty-state {
            color: #55556a;
            font-size: 13px;
            text-align: center;
            padding: 40px 10px;
        }

        .msg {
            margin-bottom: 10px;
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.sent {
            background: #6c5ce7;
            color: #fff;
            align-self: flex-end;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .msg.received {
            background: #25252c;
            color: #e0e0e8;
            align-self: flex-start;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .msg .msg-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
            font-size: 10px;
            color: #8888a0;
        }

        .msg.sent .msg-meta {
            color: #b8b0e8;
        }

        .msg .msg-sender {
            font-weight: 500;
            font-size: 12px;
            margin-bottom: 2px;
        }

        .msg.sent .msg-sender {
            color: #c8c0f0;
        }

        .msg.received .msg-sender {
            color: #88d0ff;
        }

        .messages-area {
            display: flex;
            flex-direction: column;
        }

        /* INPUT AREA */
        .input-area {
            display: flex;
            gap: 10px;
            padding-top: 10px;
            border-top: 1px solid #2a2a30;
            flex-shrink: 0;
        }

        .input-area .input-group {
            flex: 1;
        }

        .input-area .input-group input {
            width: 100%;
            padding: 10px 14px;
            background: #121217;
            border: 1px solid #2c2c34;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
        }

        .input-area .input-group input:focus {
            outline: none;
            border-color: #6c5ce7;
            background: #18181e;
        }

        .input-area .input-group input::placeholder {
            color: #55556a;
        }

        .input-area .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        /* HIDDEN */
        .hidden {
            display: none !important;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0f0f13;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3a44;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>💬 Chat</h1>
            <div class="status-badge">
                <span class="dot offline" id="statusDot"></span>
                <span id="statusText">Offline</span>
            </div>
        </div>

        <!-- USER INFO -->
        <div class="user-info" id="userInfo" style="display:none;">
            <span class="phone-display" id="myPhoneDisplay">📱 +919876543210</span>
            <span class="badge" id="onlineCount">0 online</span>
        </div>

        <!-- AUTH SECTION -->
        <div id="authSection">
            <div class="form-group">
                <label>📱 Phone</label>
                <input id="phoneInput" placeholder="+919876543210" value="+919876543210" />
            </div>
            <div class="form-group">
                <label>🔒 Password</label>
                <input id="passwordInput" type="password" placeholder="••••••••" value="password123" />
            </div>
            <div class="form-group">
                <label>👤 Name</label>
                <input id="nameInput" placeholder="Your name" value="Test User" />
            </div>
            <div class="btn-row">
                <button class="btn btn-primary" id="signupBtn">Sign Up</button>
                <button class="btn btn-success" id="loginBtn">Login</button>
            </div>
        </div>

        <!-- MESSAGES AREA -->
        <div class="messages-area" id="messagesArea">
            <div class="empty-state" id="emptyState">💬 No messages yet.<br />Login and start chatting!</div>
        </div>

        <!-- INPUT AREA -->
        <div class="input-area" id="inputArea" style="display:none;">
            <div class="input-group">
                <input id="recipientInput" placeholder="To (phone) e.g. +919999999999" value="+919999999999" />
            </div>
            <div class="input-group" style="flex:2;">
                <input id="messageInput" placeholder="Type a message..." />
            </div>
            <button class="btn btn-primary" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        const state = {
            ws: null,
            token: null,
            user: null,
            isConnected: false,
            messages: [],
            myPhone: null,
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const $ = (id) => document.getElementById(id);
        const statusDot = $('statusDot');
        const statusText = $('statusText');
        const myPhoneDisplay = $('myPhoneDisplay');
        const onlineCount = $('onlineCount');
        const userInfo = $('userInfo');
        const authSection = $('authSection');
        const messagesArea = $('messagesArea');
        const emptyState = $('emptyState');
        const inputArea = $('inputArea');

        const phoneInput = $('phoneInput');
        const passwordInput = $('passwordInput');
        const nameInput = $('nameInput');
        const recipientInput = $('recipientInput');
        const messageInput = $('messageInput');

        const signupBtn = $('signupBtn');
        const loginBtn = $('loginBtn');
        const sendBtn = $('sendBtn');

        // ============================================================
        // LOCAL STORAGE
        // ============================================================
        function loadMessages() {
            const stored = localStorage.getItem('chat_messages');
            if (stored) {
                try {
                    state.messages = JSON.parse(stored);
                    return true;
                } catch { /* ignore */ }
            }
            state.messages = [];
            return false;
        }

        function saveMessages() {
            try {
                localStorage.setItem('chat_messages', JSON.stringify(state.messages));
            } catch { /* ignore */ }
        }

        function loadUser() {
            const stored = localStorage.getItem('chat_user');
            if (stored) {
                try {
                    const user = JSON.parse(stored);
                    if (user.phone) {
                        state.user = user;
                        state.myPhone = user.phone;
                        return true;
                    }
                } catch { /* ignore */ }
            }
            return false;
        }

        function saveUser(user) {
            try {
                localStorage.setItem('chat_user', JSON.stringify(user));
            } catch { /* ignore */ }
        }

        function loadToken() {
            const stored = localStorage.getItem('chat_token');
            if (stored) {
                state.token = stored;
                return true;
            }
            return false;
        }

        function saveToken(token) {
            try {
                localStorage.setItem('chat_token', token);
            } catch { /* ignore */ }
        }

        function clearSession() {
            localStorage.removeItem('chat_token');
            localStorage.removeItem('chat_user');
            // Keep messages
            state.token = null;
            state.user = null;
            state.myPhone = null;
        }

        // ============================================================
        // UI HELPERS
        // ============================================================
        function setStatus(connected) {
            state.isConnected = connected;
            statusDot.className = `dot ${connected ? 'online' : 'offline'}`;
            statusText.textContent = connected ? 'Online' : 'Offline';
        }

        function updateOnlineCount(count) {
            onlineCount.textContent = count > 0 ? `${count} online` : '0 online';
        }

        function showAuth(show) {
            authSection.classList.toggle('hidden', !show);
            userInfo.style.display = show ? 'none' : 'flex';
            inputArea.style.display = show ? 'none' : 'flex';
        }

        function renderMessages() {
            // Clear existing messages (keep empty state)
            const existing = messagesArea.querySelectorAll('.msg');
            existing.forEach(el => el.remove());

            if (state.messages.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            // Render all messages
            state.messages.forEach(msg => {
                const isSent = msg.from === state.myPhone;
                const div = document.createElement('div');
                div.className = `msg ${isSent ? 'sent' : 'received'}`;

                const senderName = msg.sender_name || (isSent ? 'You' : msg.from);
                div.innerHTML = `
                    <div class="msg-sender">${senderName}</div>
                    ${msg.message}
                    <div class="msg-meta">
                        <span>${new Date(msg.timestamp || Date.now()).toLocaleTimeString()}</span>
                        ${isSent ? '✓' : ''}
                    </div>
                `;
                messagesArea.appendChild(div);
            });

            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function addMessage(msg) {
            // Avoid duplicates (check by content + timestamp + from)
            const exists = state.messages.some(m =>
                m.message === msg.message &&
                m.from === msg.from &&
                Math.abs((m.timestamp || 0) - (msg.timestamp || 0)) < 1000
            );
            if (exists) return;

            state.messages.push(msg);
            saveMessages();
            renderMessages();
        }

        function setMyPhone(phone) {
            state.myPhone = phone;
            myPhoneDisplay.textContent = `📱 ${phone}`;
            if (state.user) {
                state.user.phone = phone;
                saveUser(state.user);
            }
        }

        // ============================================================
        // AUTH FLOW
        // ============================================================
        function loginSuccess(token, user) {
            state.token = token;
            state.user = user;
            state.myPhone = user.phone;

            saveToken(token);
            saveUser(user);

            setMyPhone(user.phone);
            showAuth(false);
            setStatus(false);
            updateOnlineCount(0);

            // Load previous messages
            loadMessages();
            renderMessages();

            // Auto-connect WebSocket
            connectWebSocket();
        }

        // ============================================================
        // HTTP REQUESTS
        // ============================================================
        const API_BASE = 'http://localhost:8000';

        async function httpPost(endpoint, body) {
            const res = await fetch(`${API_BASE}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const text = await res.text();
            try { return JSON.parse(text); } catch { return { raw: text }; }
        }

        // ============================================================
        // SIGNUP
        // ============================================================
        signupBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            const password = passwordInput.value.trim();
            const name = nameInput.value.trim();

            if (!phone || !password || !name) {
                alert('Please fill in all fields');
                return;
            }

            try {
                const res = await httpPost('/signup', { phone, password, name });
                if (res.message) {
                    alert('✅ ' + res.message);
                } else if (res.error) {
                    alert('❌ ' + res.error);
                } else {
                    alert('✅ ' + JSON.stringify(res));
                }
            } catch (e) {
                alert('❌ Signup error: ' + e.message);
            }
        });

        // ============================================================
        // LOGIN
        // ============================================================
        loginBtn.addEventListener('click', async () => {
            const phone = phoneInput.value.trim();
            const password = passwordInput.value.trim();

            if (!phone || !password) {
                alert('Please enter phone and password');
                return;
            }

            try {
                const res = await httpPost('/login', { phone, password });

                if (res.token) {
                    const user = {
                        phone: phone,
                        name: nameInput.value.trim() || 'User'
                    };
                    loginSuccess(res.token, user);
                } else if (res.message) {
                    alert('❌ ' + res.message);
                } else {
                    alert('❌ ' + JSON.stringify(res));
                }
            } catch (e) {
                alert('❌ Login error: ' + e.message);
            }
        });

        // ============================================================
        // WEBSOCKET
        // ============================================================
        function connectWebSocket() {
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                return;
            }

            if (!state.token) {
                return;
            }

            state.ws = new WebSocket('ws://localhost:8080');

            state.ws.onopen = () => {
                setStatus(true);
                // Send auth
                state.ws.send(JSON.stringify({
                    event: 'auth',
                    data: state.token,
                }));
            };

            state.ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);

                    // Handle auth success
                    if (msg.event === 'auth_success') {
                        setStatus(true);
                        return;
                    }

                    // Handle auth failed
                    if (msg.event === 'auth_failed') {
                        alert('❌ Authentication failed: ' + (msg.message || 'Invalid token'));
                        setStatus(false);
                        return;
                    }

                    // Handle chat messages
                    if (msg.message) {
                        addMessage({
                            from: msg.sender_phone || 'unknown',
                            sender_name: msg.sender_name || 'Unknown',
                            message: msg.message,
                            timestamp: Date.now(),
                        });
                        return;
                    }

                    // Handle any message with a message field
                    if (msg.data && msg.data.message) {
                        addMessage({
                            from: msg.data.sender_phone || msg.data.sender_name || 'unknown',
                            sender_name: msg.data.sender_name || 'Unknown',
                            message: msg.data.message,
                            timestamp: Date.now(),
                        });
                        return;
                    }

                } catch (e) {
                    // Silent ignore
                }
            };

            state.ws.onclose = () => {
                setStatus(false);
                state.ws = null;
            };

            state.ws.onerror = (error) => {
                setStatus(false);
            };
        }

        // ============================================================
        // SEND MESSAGE
        // ============================================================
        function sendMessage() {
            if (!state.ws || state.ws.readyState !== WebSocket.OPEN) {
                alert('Not connected to chat server.');
                return;
            }

            const receiver = recipientInput.value.trim();
            const text = messageInput.value.trim();

            if (!receiver || !text) {
                alert('Please enter recipient and message');
                return;
            }

            const payload = {
                event: 'chat',
                data: {
                    reciever_phonenum: receiver,
                    message: text,
                    sendername: state.user?.name || state.myPhone || 'Me',
                    sender_phone: state.myPhone,
                },
            };

            state.ws.send(JSON.stringify(payload));

            // Add to local messages (sent)
            addMessage({
                from: state.myPhone,
                sender_name: 'You',
                message: text,
                timestamp: Date.now(),
            });

            messageInput.value = '';
        }

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // ============================================================
        // AUTO-RECONNECT
        // ============================================================
        setInterval(() => {
            if (state.token && (!state.ws || state.ws.readyState !== WebSocket.OPEN)) {
                connectWebSocket();
            }
        }, 5000);

        // ============================================================
        // INIT
        // ============================================================
        // Load session
        const hasToken = loadToken();
        const hasUser = loadUser();

        if (hasToken && hasUser && state.user) {
            state.myPhone = state.user.phone;
            setMyPhone(state.user.phone);
            showAuth(false);
            loadMessages();
            renderMessages();
            connectWebSocket();
        } else {
            // Check if we have messages to show
            loadMessages();
            renderMessages();
            showAuth(true);
        }

        // Enter to login
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        console.log('💬 Chat app ready!');
    </script>

</body>
</html>
