<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<title>Stark</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --radius-sm:8px; --radius-md:14px; --radius-lg:20px; --radius-pill:999px;
  --shadow-1:0 1px 2px rgba(0,0,0,.24);
  --shadow-2:0 8px 24px rgba(0,0,0,.28);
  --shadow-3:0 20px 60px rgba(0,0,0,.38);
  --ease:cubic-bezier(.2,.8,.2,1);
}

/* ---------------- dark theme (default) ---------------- */
html[data-theme="dark"]{
  --bg:#0c0d0f; --bg-elevated:#141519; --panel:#17181c; --panel-2:#1d1f24; --panel-3:#25272e;
  --line:#2a2c33; --line-soft:#212329;
  --text:#eeece6; --text-dim:#9a9ca3; --text-faint:#65676f;
  --accent:#cd9b5c; --accent-strong:#e3b378; --accent-ink:#20150a;
  --accent-wash:rgba(205,155,92,.14);
  --bubble-theirs:#1d1f24; --bubble-mine:#2c2415; --bubble-mine-border:#4a3a1c;
  --danger:#e0665a; --success:#5fbf82;
  --scrim:rgba(6,6,8,.62);
}

/* ---------------- light theme ---------------- */
html[data-theme="light"]{
  --bg:#f3f1eb; --bg-elevated:#ffffff; --panel:#ffffff; --panel-2:#f6f4ee; --panel-3:#ece9e0;
  --line:#e3dfd3; --line-soft:#ece9e0;
  --text:#221f19; --text-dim:#726d61; --text-faint:#a19c8e;
  --accent:#a5713b; --accent-strong:#8a5c2c; --accent-ink:#fff8ef;
  --accent-wash:rgba(165,113,59,.10);
  --bubble-theirs:#ffffff; --bubble-mine:#f4e8d6; --bubble-mine-border:#e7d3ac;
  --danger:#c8483a; --success:#3f9a63;
  --scrim:rgba(30,26,18,.4);
}

*{box-sizing:border-box;}
html,body{height:100%;}
[hidden]{display:none!important;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  transition:background .25s var(--ease),color .25s var(--ease);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:disabled{cursor:default;}
input,textarea{
  font:inherit;color:var(--text);background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--radius-sm);
  padding:11px 13px;outline:none;transition:border-color .15s var(--ease),box-shadow .15s var(--ease);
}
input::placeholder,textarea::placeholder{color:var(--text-faint);}
input:focus,textarea:focus,button:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash);}
h1,h2{font-family:Fraunces,serif;font-weight:500;margin:0;letter-spacing:-.01em;}
p{margin:0;}
::selection{background:var(--accent-wash);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--text-faint);background-clip:padding-box;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ================= AUTH ================= */
.auth-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px;
  background:
    radial-gradient(680px 420px at 18% -8%, var(--accent-wash), transparent 60%),
    radial-gradient(600px 500px at 100% 100%, var(--accent-wash), transparent 55%),
    var(--bg);
}
.auth-card{
  width:100%;max-width:392px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:40px 36px 34px;box-shadow:var(--shadow-3);
}
.brand{font-size:30px;letter-spacing:-.01em;color:var(--text);display:flex;align-items:center;gap:10px;}
.brand::before{
  content:"";width:11px;height:11px;border-radius:3px;background:var(--accent);
  box-shadow:0 0 0 4px var(--accent-wash);flex:none;
}
.brand.small{font-size:20px;}
.brand.small::before{width:9px;height:9px;border-radius:2.5px;}
.tagline{color:var(--text-dim);margin:8px 0 26px;font-size:13.5px;}
.tabs{display:flex;gap:2px;background:var(--panel-2);border-radius:var(--radius-sm);padding:4px;margin-bottom:22px;}
.tabs .tab{flex:1;padding:9px;border-radius:6px;color:var(--text-dim);font-size:13.5px;font-weight:500;transition:background .15s var(--ease),color .15s var(--ease);}
.tabs .tab.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow-1);}
.auth-form{display:flex;flex-direction:column;gap:14px;}
.auth-form label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--text-dim);font-weight:500;}
.auth-form button[type=submit]{
  margin-top:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;
  padding:12px;border-radius:var(--radius-sm);font-size:14.5px;transition:background .15s var(--ease),transform .1s var(--ease);
}
.auth-form button[type=submit]:hover{background:var(--accent-strong);}
.auth-form button[type=submit]:active{transform:scale(.98);}
.advanced{margin-top:22px;font-size:12.5px;color:var(--text-dim);}
.advanced summary{cursor:pointer;list-style:none;}
.advanced summary::-webkit-details-marker{display:none;}
.advanced summary::before{content:"⚙ ";opacity:.7;}
.advanced label{display:flex;flex-direction:column;gap:5px;margin-top:12px;font-weight:500;}
.auth-err{color:var(--danger);font-size:12.5px;min-height:18px;margin-top:4px;}

/* ================= APP SHELL ================= */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden;background:var(--bg);}

.sidebar{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;}
.sidebar-head{display:flex;align-items:center;gap:8px;padding:20px 18px 14px;}
.sidebar-head .brand.small{flex:1;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--text-faint);flex:none;transition:background .2s var(--ease),box-shadow .2s var(--ease);}
.dot.on{background:var(--success);box-shadow:0 0 0 3px color-mix(in srgb, var(--success) 22%, transparent);}
.icon-btn{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:18px;flex:none;transition:background .15s var(--ease),color .15s var(--ease);
}
.icon-btn:hover{background:var(--panel-2);color:var(--text);}
.search-wrap{margin:2px 18px 14px;position:relative;}
.search-wrap::before{
  content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--text-faint);font-size:16px;pointer-events:none;
}
.search{width:100%;padding-left:34px;background:var(--panel-2);border-radius:var(--radius-pill);}
.conv-list{flex:1;overflow-y:auto;padding:4px 8px 12px;}
.conv-item{
  display:flex;align-items:center;gap:12px;padding:11px 10px;cursor:pointer;
  border-radius:var(--radius-md);transition:background .15s var(--ease);
}
.conv-item:hover{background:var(--panel-2);}
.conv-item.active{background:var(--accent-wash);}
.avatar{
  width:46px;height:46px;border-radius:50%;flex:none;position:relative;
  display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;
  color:var(--accent-ink);background:linear-gradient(155deg, var(--accent), var(--accent-strong));
}
.avatar .presence-dot{
  position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;
  background:var(--text-faint);border:2.5px solid var(--panel);transition:background .2s var(--ease);
}
.avatar .presence-dot.on{background:var(--success);}
.conv-meta{flex:1;min-width:0;}
.conv-top-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.conv-name{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.conv-time{font-size:11px;color:var(--text-faint);flex:none;}
.conv-sub{font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.badge{
  background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;
  min-width:19px;height:19px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  padding:0 5px;flex:none;
}

.chat{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg-elevated);position:relative;}
.chat::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(900px 500px at 100% 0%, var(--accent-wash), transparent 60%);
}
.empty-state{margin:auto;text-align:center;color:var(--text-dim);position:relative;max-width:280px;padding:0 20px;}
.empty-state .mark{
  width:52px;height:52px;border-radius:16px;margin:0 auto 18px;background:var(--accent-wash);
  display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--accent);
}
.empty-state h2{color:var(--text);margin-bottom:8px;font-size:20px;}
.empty-state p{font-size:13.5px;line-height:1.5;}

.chat-view{display:flex;flex-direction:column;height:100%;min-height:0;position:relative;}
.chat-head{
  display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);
  flex:none;background:var(--panel);
}
.chat-head .back{display:none;}
.peer-info{flex:1;min-width:0;}
.peer-name{font-weight:600;display:block;font-size:15px;}
.peer-status{font-size:12.5px;color:var(--text-dim);}
.pinned-bar{
  padding:10px 20px;background:var(--accent-wash);border-bottom:1px solid var(--line);
  font-size:13px;color:var(--accent);display:flex;gap:10px;align-items:center;cursor:pointer;flex:none;
}
.pinned-bar span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}

.messages{flex:1;overflow-y:auto;padding:24px 26px;display:flex;flex-direction:column;gap:2px;position:relative;}
.day-sep{
  align-self:center;color:var(--text-dim);font-size:11.5px;font-weight:600;
  margin:18px 0 10px;background:var(--panel-2);padding:5px 12px;border-radius:var(--radius-pill);
}
.msg{max-width:62%;position:relative;margin-top:10px;}
.msg.mine{align-self:flex-end;}
.msg.theirs{align-self:flex-start;}
.msg .sender{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:3px;padding:0 4px;}
.bubble{
  padding:10px 14px;border-radius:var(--radius-md);font-size:14.5px;line-height:1.48;
  white-space:pre-wrap;word-break:break-word;background:var(--bubble-theirs);
  border:1px solid var(--line);box-shadow:var(--shadow-1);
}
.msg.theirs .bubble{border-bottom-left-radius:4px;}
.msg.mine .bubble{background:var(--bubble-mine);border-color:var(--bubble-mine-border);border-bottom-right-radius:4px;}
.msg.deleted .bubble{font-style:italic;color:var(--text-faint);box-shadow:none;}
.reply-quote{border-left:2.5px solid var(--accent);padding:3px 10px;margin-bottom:6px;font-size:12.5px;color:var(--text-dim);opacity:.9;border-radius:0 6px 6px 0;background:rgba(0,0,0,.08);}
.reply-quote b{color:var(--text);font-weight:600;}
.meta-row{display:flex;gap:6px;align-items:center;margin-top:3px;padding:0 4px;font-size:10.5px;color:var(--text-faint);}
.msg.mine .meta-row{justify-content:flex-end;}
.tick{color:var(--text-faint);letter-spacing:-1px;}
.tick.seen{color:var(--accent);}
.pin-flag{font-size:10px;}
.kebab{
  position:absolute;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--panel);
  border:1px solid var(--line);opacity:0;font-size:14px;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);box-shadow:var(--shadow-1);transition:opacity .12s var(--ease),background .12s var(--ease);
}
.msg.mine .kebab{left:-30px;}
.msg.theirs .kebab{right:-30px;}
.kebab:hover{background:var(--panel-2);color:var(--text);}
.msg:hover .kebab,.kebab.open{opacity:1;}

.typing-row{padding:0 26px 8px;font-size:13px;color:var(--text-dim);font-style:italic;flex:none;}
.reply-bar{display:flex;align-items:center;gap:10px;padding:10px 20px;border-top:1px solid var(--line);flex:none;background:var(--panel);}
.reply-info{flex:1;border-left:2.5px solid var(--accent);padding-left:10px;min-width:0;}
.reply-info span{font-size:12.5px;color:var(--accent);font-weight:600;}
.reply-info p{margin:2px 0 0;font-size:13px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.composer{display:flex;gap:12px;align-items:flex-end;padding:16px 20px;border-top:1px solid var(--line);flex:none;background:var(--panel);}
.composer textarea{
  flex:1;resize:none;max-height:140px;border-radius:var(--radius-lg);padding:12px 16px;
  background:var(--panel-2);
}
.send-btn{
  background:var(--accent);color:var(--accent-ink);font-weight:600;padding:12px 22px;
  border-radius:var(--radius-pill);font-size:14px;transition:background .15s var(--ease),transform .1s var(--ease);
}
.send-btn:hover{background:var(--accent-strong);}
.send-btn:active{transform:scale(.97);}
.send-btn:disabled{opacity:.4;}

/* ================= MODALS / MENUS ================= */
.overlay{
  position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;
  z-index:50;padding:20px;backdrop-filter:blur(3px);
}
.modal{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:28px;width:100%;max-width:400px;box-shadow:var(--shadow-3);
}
.modal h2{font-size:19px;margin-bottom:18px;}
.modal .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:12.5px;color:var(--text-dim);font-weight:500;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
.btn-ghost{padding:10px 15px;border-radius:var(--radius-sm);color:var(--text-dim);font-weight:500;transition:background .15s var(--ease);}
.btn-ghost:hover{background:var(--panel-2);color:var(--text);}
.btn-primary{padding:10px 18px;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-ink);font-weight:600;transition:background .15s var(--ease);}
.btn-primary:hover{background:var(--accent-strong);}
.participant-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
.participant-row span{flex:1;}
.participant-row button{color:var(--danger);font-size:12px;font-weight:600;}
.danger-zone{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:10px;}
.danger-zone button{font-size:12.5px;padding:9px 13px;border-radius:var(--radius-sm);border:1px solid var(--line);font-weight:500;transition:border-color .15s var(--ease),color .15s var(--ease);}
.danger-zone button:hover{border-color:var(--danger);color:var(--danger);}

.ctx-menu{
  position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:6px;min-width:168px;box-shadow:var(--shadow-3);
}
.ctx-menu button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:13.5px;font-weight:500;}
.ctx-menu button:hover{background:var(--panel-2);}
.ctx-menu button.danger{color:var(--danger);}

#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--panel);border:1px solid var(--line);padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;box-shadow:var(--shadow-2);animation:up .2s var(--ease);}
.toast.error{border-color:var(--danger);color:var(--danger);}
@keyframes up{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}

/* ================= RESPONSIVE ================= */
@media (max-width:780px){
  .sidebar{position:fixed;inset:0;width:100%;z-index:5;transition:transform .25s var(--ease);padding-top:env(safe-area-inset-top);}
  .app.show-chat .sidebar{transform:translateX(-100%);}
  .chat{position:fixed;inset:0;transform:translateX(100%);transition:transform .25s var(--ease);}
  .app.show-chat .chat{transform:translateX(0);}
  .chat-head{padding-top:calc(14px + env(safe-area-inset-top));}
  .chat-head .back{display:flex;}
  .composer{padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  .msg{max-width:86%;}
  .messages{padding:18px 14px;}
  .auth-card{padding:30px 24px;}
}
</style>
</head>
<body>
<div id="toast-root"></div>

<section class="auth-screen" id="authScreen">
  <div class="auth-card">
    <h1 class="brand">Stark</h1>
    <p class="tagline">Direct, private, no noise.</p>
    <div class="tabs">
      <button class="tab active" data-tab="login">Log in</button>
      <button class="tab" data-tab="signup">Sign up</button>
    </div>
    <form id="loginForm" class="auth-form">
      <label>Phone number<input required id="loginPhone" type="tel"></label>
      <label>Password<input required id="loginPass" type="password"></label>
      <button type="submit">Log in</button>
    </form>
    <form id="signupForm" class="auth-form" hidden>
      <label>Name<input required id="suName" type="text"></label>
      <label>Phone number<input required id="suPhone" type="tel"></label>
      <label>Password<input required id="suPass" type="password"></label>
      <button type="submit">Create account</button>
    </form>
    <p class="auth-err" id="authErr"></p>
    <details class="advanced">
      <summary>Server settings</summary>
      <label>HTTP base<input id="cfgHttp" value="http://localhost:8000"></label>
      <label>WebSocket URL<input id="cfgWs" value="ws://localhost:8080"></label>
    </details>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="sidebar">
    <div class="sidebar-head">
      <h1 class="brand small">Stark</h1>
      <span class="dot" id="wsDot" title="connection"></span>
      <button class="icon-btn" id="themeBtn" title="Toggle theme">◐</button>
      <button class="icon-btn" id="newBtn" title="New">+</button>
    </div>
    <div class="search-wrap"><input class="search" id="searchBox" placeholder="Search"></div>
    <div class="conv-list" id="convList"></div>
  </aside>
  <main class="chat">
    <div class="empty-state" id="emptyState">
      <div class="mark">✎</div>
      <h2>Select a conversation</h2>
      <p>Or start something new.</p>
    </div>
    <div class="chat-view" id="chatView" hidden>
      <header class="chat-head">
        <button class="icon-btn back" id="backBtn">←</button>
        <div class="peer-info">
          <span class="peer-name" id="peerName"></span>
          <span class="peer-status" id="peerStatus"></span>
        </div>
        <button class="icon-btn" id="infoBtn" title="Info">⋯</button>
      </header>
      <div class="pinned-bar" id="pinnedBar" hidden></div>
      <div class="messages" id="messages"></div>
      <div class="typing-row" id="typingRow" hidden></div>
      <div class="reply-bar" id="replyBar" hidden>
        <div class="reply-info"><span id="replyLabel"></span><p id="replyText"></p></div>
        <button class="icon-btn" id="cancelReply">×</button>
      </div>
      <form class="composer" id="composer">
        <textarea id="msgInput" rows="1" placeholder="Message"></textarea>
        <button type="submit" class="send-btn" id="sendBtn">Send</button>
      </form>
    </div>
  </main>
</div>

<script>
'use strict';
let HTTP_BASE='http://localhost:8000', WS_URL='ws://localhost:8080';
let TOKEN=null, ME=null, ws=null, reconnectTries=0, reconnectTimer=null;
const CONVOS=new Map();   // peerPhone -> {peer,id,messages,unread,lastAt,name,pinned,status}
const GROUPS=new Map();   // groupId -> {id,name,admin,participants:Set,messages,unread,lastAt,pinned}
const nameCache=new Map();
const pending=new Map();  // tempid -> {type,el}
let current=null;         // {type:'dm',peer} | {type:'group',id}
let subscribedPeer=null;  // peer we're currently subscribed to for live presence via pub/sub
let replyTo=null;
let seenObserver=null, pendingSeen=new Set(), seenFlushTimer=null;
let typingLastSent=0, typingStopTimer=null, peerTypingTimer=null;

const $=s=>document.querySelector(s);
const esc=s=>(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtTime=d=>new Date(d).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
function toast(msg,type=''){const t=document.createElement('div');t.className='toast '+type;t.textContent=msg;$('#toast-root').appendChild(t);setTimeout(()=>t.remove(),3200);}
function decodeJWT(t){try{const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(atob(p).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));}catch(e){return{};}}
async function api(path,body){
  const res=await fetch(HTTP_BASE+path,{method:'POST',headers:{'Content-Type':'application/json',token:TOKEN||''},body:JSON.stringify(body||{})});
  const raw=await res.text();
  let data; try{data=JSON.parse(raw);}catch(e){data=raw;}
  return {ok:res.ok,data};
}

/* ---------- websocket ---------- */
function connectWS(){
  clearTimeout(reconnectTimer);
  ws=new WebSocket(WS_URL);
  ws.onopen=()=>{reconnectTries=0; setDot(true); ws.send(JSON.stringify({event:'auth',data:TOKEN})); if(current&&current.type==='dm') queryActiveStatus(current.peer);};
  ws.onclose=()=>{setDot(false); if(TOKEN){reconnectTries++; reconnectTimer=setTimeout(connectWS,Math.min(1000*reconnectTries,8000));}};
  ws.onerror=()=>{};
  ws.onmessage=e=>handleMessage(e.data);
}
function setDot(on){$('#wsDot').classList.toggle('on',on);}
function wsSend(obj){if(ws&&ws.readyState===WebSocket.OPEN) ws.send(JSON.stringify(obj));}

function handleMessage(raw){
  let msg; try{msg=JSON.parse(raw);}catch(e){return;}
  const ev=msg.event;
  if(!ev){
    if(msg.tempid!==undefined) return handleAck(msg);
    return;
  }
  switch(ev){
    case 'group-data': loadGroups(msg.message); break;
    case 'auth': toast(msg.message,'error'); logout(); break;
    case 'chat': handleIncomingChat(msg); break;
    case 'typing': handlePeerTyping(msg.convId,'dm'); break;
    case 'group-typing': handlePeerTyping(msg.groupId,'group'); break;
    case 'seen': updateTick(msg.messageId,'seen'); break;
    case 'seen_batch_success': (msg.data.messageIds||[]).forEach(id=>updateTick(id,'seen')); break;
    case 'added to a room': addLocalGroupStub(msg); break;
    case 'user added': toast('Member added'); break;
    case 'invalid room creds': case 'unathorized action': case 'not participant':
    case 'error while removal': case 'issue with group leaving':
      toast(msg.message,'error'); break;
    case 'group message recieved': handleIncomingGroupMsg(msg.message); break;
    case 'left-group': toast(msg.message); if(current&&current.type==='group') openEmpty(); break;
    case 'notify others': systemNote(msg); break;
    case 'removed from the group': GROUPS.delete(msg.roomId); if(current&&current.type==='group'&&current.id===msg.roomId) openEmpty(); renderSidebar(); toast('Removed from a group'); break;
    case 'user removal': break;
    case 'removal success': toast('Member removed'); break;
    case 'group_deleted': case 'delete_success': handleGroupDeleted(msg.data); break;
    case 'pinned': applyPin(msg.pinInfo,true); break;
    case 'unpinned': applyPin(msg.pinInfo,false); break;
    case 'message_global_deleted': case 'global_delete_success': applyGlobalDelete(msg.data); break;
    case 'reciever status': setPeerStatus(msg.status); break;
    case 'active status': handlePushedStatus(msg.user,msg.status); break;
    case 'error': toast(msg.message,'error'); break;
  }
}

function handleAck(msg){
  const p=pending.get(msg.tempid);
  if(!p) return;
  pending.delete(msg.tempid);
  if(p.type==='chat'||p.type==='group'){
    if(msg.correctid){p.el.dataset.id=msg.correctid; setTick(p.el,msg.status||'sent');}
    if(p.type==='chat' && !CONVOS.get(p.peer).id) refreshConversations();
  } else if(p.type==='createroom'){
    if(msg.correctid){
      GROUPS.set(String(msg.correctid),{id:msg.correctid,name:p.name,admin:ME.phone,participants:new Set([ME.phone]),messages:[],unread:0,lastAt:Date.now(),pinned:null});
      renderSidebar(); openGroup(String(msg.correctid));
    }
  }
}
async function refreshConversations(){
  const {ok,data}=await api('/myconversation');
  if(ok && Array.isArray(data)) data.forEach(row=>{
    const peer=row.user1_phone===ME.phone?row.user2_phone:row.user1_phone;
    const c=CONVOS.get(peer); if(c && !c.id) c.id=row.id;
  });
}

/* ---------- sidebar ---------- */
function renderSidebar(){

    const presenceDot=i.kind==='dm'?`<span class="presence-dot${i.online?' on':''}"></span>`:'';

/* ---------- opening a conversation ---------- */
function openEmpty(){
  syncSubscription(null);
  current=null; $('#emptyState').hidden=false; $('#chatView').hidden=true; $('#app').classList.remove('show-chat');
}
async function openDM(peer){
  current={type:'dm',peer};
  syncSubscription(peer);
  $('#app').classList.add('show-chat');
  let c=CONVOS.get(peer); if(!c){c={peer,id:null,messages:[],unread:0,lastAt:Date.now(),name:null,status:'offline'}; CONVOS.set(peer,c);}
  c.unread=0;
  showChatShell(peer,c.status==='online'?'online':'offline');
  queryActiveStatus(peer);
  renderPinned(c.pinned);
  if(c.id && c.messages.length===0){
    const {ok,data}=await api('/getmessages',{conversationId:c.id});
    if(ok && data.messages) c.messages=data.messages;
  }
  renderMessages(c.messages,'dm');
  renderSidebar();
}
async function openGroup(id){
  current={type:'group',id};
  syncSubscription(null);
  $('#app').classList.add('show-chat');
  const g=GROUPS.get(id); g.unread=0;
  showChatShell(g.name,g.participants.size+' members');
  renderPinned(g.pinned);
  if(g.messages.length===0){
    const {ok,data}=await api('/getgroupmessages',{groupId:isNaN(id)?id:Number(id)});
    if(ok && data.messages) g.messages=data.messages;
  }
  renderMessages(g.messages,'group');

function showChatShell(title,sub){
  $('#emptyState').hidden=true; $('#chatView').hidden=false;
  $('#peerName').textContent=title; $('#peerStatus').textContent=sub;
  $('#typingRow').hidden=true; hideReply();
}
function setPeerStatus(status){
  if(current&&current.type==='dm'){
    $('#peerStatus').textContent=status==='online'?'online':'offline';
    const c=CONVOS.get(current.peer); if(c){c.status=status; renderSidebar();}
  }
}
function queryActiveStatus(peer){ wsSend({event:'active-status',data:{rec_phone:peer}}); }

/* ---------- live presence (pub/sub) ---------- */
function syncSubscription(peer){
  // moves our live-presence subscription from whatever peer we were watching to the new one
  if(subscribedPeer && subscribedPeer!==peer) unsubscribeStatus(subscribedPeer);
  if(peer && peer!==subscribedPeer) subscribeStatus(peer);
  subscribedPeer=peer||null;
}
function subscribeStatus(peer){ wsSend({event:'subscribe',data:{rec_phone:peer}}); }
function unsubscribeStatus(peer){ wsSend({event:'unsubscribe',data:{rec_phone:peer}}); }
function handlePushedStatus(user,status){
  if(!user) return;
  const c=CONVOS.get(user);
  if(c){ c.status=status; renderSidebar(); }
  if(current && current.type==='dm' && current.peer===user){
    $('#peerStatus').textContent=status==='online'?'online':'offline';
  }
}

$('#backBtn').onclick=()=>{$('#app').classList.remove('show-chat');};

/* ---------- messages render ---------- */
function bubbleHTML(m,mine,pinnedId){
  const status=m.status||'sent';
  const tickHTML=mine?`<span class="tick ${status==='seen'?'seen':''}">${status==='seen'?'✓✓':(status==='delivered'?'✓✓':'✓')}</span>`:'';
  const replyHTML=m.reply_content?`<div class="reply-quote"><b>${esc(m.reply_sender_name||m.reply_sender_phone||'')}</b><br>${esc((m.reply_content||'').slice(0,80))}</div>`:'';
  const deleted=m.visibility==='none';
  const body=deleted?'This message was deleted':esc(m.content);
  return `<div class="bubble">${replyHTML}${body}</div>
    <div class="meta-row">${m.is_pinned?'<span class="pin-flag">📌</span>':''}<span>${fmtTime(m.created_at)}</span>${tickHTML}</div>`;
}
function renderMessages(list,kind){
  const box=$('#messages'); box.innerHTML='';
  if(seenObserver){seenObserver.disconnect();}
  seenObserver=new IntersectionObserver(onSeenIntersect,{root:box,threshold:.6});
  let lastDay='';
  list.forEach(m=>{
    const day=new Date(m.created_at).toDateString();
    if(day!==lastDay){lastDay=day; const sep=document.createElement('div'); sep.className='day-sep'; sep.textContent=day; box.appendChild(sep);}
    box.appendChild(renderOneMessage(m,kind));
  });
  box.scrollTop=box.scrollHeight;
}
function renderOneMessage(m,kind){
  const mine=m.sender_phone===ME.phone;
  const el=document.createElement('div');
  el.className='msg '+(mine?'mine':'theirs')+(m.visibility==='none'?' deleted':'');
  el.dataset.id=m.id; el.dataset.mine=mine?'1':'';
  const senderLabel=(!mine&&kind==='group')?`<div class="sender">${esc(m.sender_name||nameCache.get(m.sender_phone)||m.sender_phone)}</div>`:'';
  el.innerHTML=`${senderLabel}<button class="kebab">⋯</button>${bubbleHTML(m,mine)}`;
  el.querySelector('.kebab').onclick=ev=>{ev.stopPropagation(); openCtxMenu(ev.currentTarget,m,kind);};
  if(!mine && m.visibility!=='none' && m.status!=='seen') seenObserver.observe(el);
  return el;
}
function appendMessage(m,kind){
  const box=$('#messages');
  box.appendChild(renderOneMessage(m,kind));
  box.scrollTop=box.scrollHeight;
}
function setTick(el,status){ const t=el.querySelector('.tick'); if(t){t.textContent=status==='seen'?'✓✓':'✓✓'; t.classList.toggle('seen',status==='seen');} }
function updateTick(id,status){
  const el=document.querySelector(`.msg[data-id="${id}"]`);
  if(el) setTick(el,status);
  [...CONVOS.values(),...GROUPS.values()].forEach(c=>{const m=c.messages.find(x=>String(x.id)===String(id)); if(m) m.status=status;});
}

/* ---------- seen-on-scroll ---------- */
function onSeenIntersect(entries){
  entries.forEach(en=>{
    if(en.isIntersecting){
      pendingSeen.add(en.target.dataset.id);
      seenObserver.unobserve(en.target);
    }
  });
  clearTimeout(seenFlushTimer);
  seenFlushTimer=setTimeout(flushSeen,500);
}
function flushSeen(){
  if(pendingSeen.size===0 || document.visibilityState!=='visible' || !current) return;
  const ids=[...pendingSeen]; pendingSeen.clear();
  wsSend({event:'seenbatch',data:{msgIds:ids.map(i=>isNaN(i)?i:Number(i)),type:current.type==='group'?'group':'conversation'}});
}
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') flushSeen(); });

/* ---------- sending ---------- */
const msgInput=$('#msgInput');
msgInput.addEventListener('input',()=>{
  msgInput.style.height='auto'; msgInput.style.height=Math.min(msgInput.scrollHeight,140)+'px';
  sendTypingDebounced();
});
msgInput.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); $('#composer').requestSubmit(); }});
function sendTypingDebounced(){
  if(!current) return;
  const now=Date.now();
  clearTimeout(typingStopTimer);
  typingStopTimer=setTimeout(()=>{typingLastSent=0;},2500);
  if(now-typingLastSent<1500) return;
  typingLastSent=now;
  if(current.type==='dm'){
    const c=CONVOS.get(current.peer);
    wsSend({event:'typing',data:{reciever_phonenum:current.peer,convId:c.id,sender_phone:ME.phone}});
  } else {
    wsSend({event:'grouptyping',data:{groupId:current.id,sender_phone:ME.phone}});
  }
}
function handlePeerTyping(key,kind){
  if(!current) return;
  const match=(kind==='dm' && current.type==='dm' && CONVOS.get(current.peer).id===key)||(kind==='group' && current.type==='group' && String(current.id)===String(key));
  if(!match) return;
  $('#typingRow').hidden=false; $('#typingRow').textContent='typing…';
  clearTimeout(peerTypingTimer);
  peerTypingTimer=setTimeout(()=>{$('#typingRow').hidden=true;},2800);
}

$('#composer').onsubmit=e=>{
  e.preventDefault();
  const text=msgInput.value.trim();
  if(!text || !current) return;
  const tempid='t'+Date.now()+Math.random().toString(36).slice(2,7);
  const localMsg={id:tempid,sender_phone:ME.phone,content:text,created_at:new Date().toISOString(),status:'sending',reply_to:replyTo?replyTo.id:null,reply_content:replyTo?replyTo.text:null,reply_sender_name:replyTo?replyTo.name:null,visibility:'all'};
  if(current.type==='dm'){
    const c=CONVOS.get(current.peer);
    appendMessage(localMsg,'dm'); c.messages.push(localMsg); c.lastMsg=text; c.lastAt=Date.now();
    pending.set(tempid,{type:'chat',el:document.querySelector(`.msg[data-id="${tempid}"]`),peer:current.peer});
    wsSend({event:'chat',data:{sender_phonenum:ME.phone,reciever_phonenum:current.peer,content:text,tempid,reply_to:replyTo?replyTo.id:null}});
  } else {
    const g=GROUPS.get(current.id);
    appendMessage(localMsg,'group'); g.messages.push(localMsg); g.lastMsg=text; g.lastAt=Date.now();
    pending.set(tempid,{type:'group',el:document.querySelector(`.msg[data-id="${tempid}"]`)});
    wsSend({event:'sendtoroom',data:{roomId:isNaN(current.id)?current.id:Number(current.id),tempmsgId:tempid,sender_phone:ME.phone,message:text,reply_to:replyTo?replyTo.id:null}});
  }
  msgInput.value=''; msgInput.style.height='auto'; hideReply(); renderSidebar();
};

function handleIncomingChat(msg){
  const m=msg.content||msg.messageResult; if(!m) return;
  const peer=m.sender_phone;
  let c=CONVOS.get(peer); if(!c){c={peer,id:m.conversation_id||null,messages:[],unread:0,lastAt:Date.now(),name:null,status:'offline'}; CONVOS.set(peer,c);}
  if(m.conversation_id && !c.id) c.id=m.conversation_id;
  c.messages.push(m); c.lastMsg=m.content; c.lastAt=m.created_at;
  if(current && current.type==='dm' && current.peer===peer){ appendMessage(m,'dm'); }
  else c.unread++;
  renderSidebar();
}
function handleIncomingGroupMsg(m){
  if(!m || !m.group_id) return;
  const id=String(m.group_id);
  const g=GROUPS.get(id); if(!g) return;
  g.messages.push(m); g.lastMsg=m.content; g.lastAt=m.created_at;
  if(current && current.type==='group' && current.id===id) appendMessage(m,'group');
  else g.unread++;
  renderSidebar();
}
function systemNote(msg){
  if(current && current.type==='group' && String(current.id)===String(msg.roomId)) toast(msg.message);
}

/* ---------- reply ---------- */
function setReply(m){
  replyTo={id:m.id,text:m.content,name:m.sender_phone===ME.phone?'You':(m.sender_name||m.sender_phone)};
  $('#replyBar').hidden=false; $('#replyLabel').textContent='Replying to '+replyTo.name; $('#replyText').textContent=replyTo.text;
  msgInput.focus();
}
function hideReply(){replyTo=null; $('#replyBar').hidden=true;}
$('#cancelReply').onclick=hideReply;

/* ---------- context menu (pin/reply/delete) ---------- */
function openCtxMenu(anchor,m,kind){
  document.querySelectorAll('.ctx-menu').forEach(x=>x.remove());
  const mine=m.sender_phone===ME.phone;
  const menu=document.createElement('div'); menu.className='ctx-menu';
  const rect=anchor.getBoundingClientRect();
  menu.style.top=(rect.bottom+4)+'px'; menu.style.left=Math.max(8,rect.left-120)+'px';
  const btns=[];
  btns.push(['Reply',()=>setReply(m)]);
  btns.push([m.is_pinned?'Unpin':'Pin',()=>togglePin(m,kind)]);
  btns.push(['Delete for me',()=>deleteForMe(m)]);
  if(mine) btns.push(['Delete for everyone',()=>deleteForEveryone(m,kind),true]);
  btns.forEach(([label,fn,danger])=>{const b=document.createElement('button'); if(danger)b.className='danger'; b.textContent=label; b.onclick=()=>{fn(); menu.remove();}; menu.appendChild(b);});
  document.body.appendChild(menu);
  anchor.classList.add('open');
  setTimeout(()=>document.addEventListener('click',function h(){menu.remove();anchor.classList.remove('open');document.removeEventListener('click',h);},{once:true}));
}
function togglePin(m,kind){
  const willPin=!m.is_pinned;
  wsSend({event:willPin?'pinmsg':'unpin',data:{msgId:m.id,sender_phone:ME.phone}});
  m.is_pinned=willPin;
  const store=kind==='dm'?CONVOS.get(current.peer):GROUPS.get(current.id);
  store.pinned=willPin?m:null;
  renderPinned(store.pinned);
  const el=document.querySelector(`.msg[data-id="${m.id}"]`);
  if(el) el.querySelector('.pin-flag')?.remove(), el.outerHTML=el.outerHTML;
  refreshCurrentList();
}
function applyPin(info,pinned){
  if(!info) return;
  [...CONVOS.values(),...GROUPS.values()].forEach(c=>{
    const m=c.messages.find(x=>String(x.id)===String(info.id));
    if(m){m.is_pinned=pinned; if(pinned)c.pinned=m; else if(c.pinned&&c.pinned.id===m.id)c.pinned=null;}
  });
  if(current){const store=current.type==='dm'?CONVOS.get(current.peer):GROUPS.get(current.id); if(store) renderPinned(store.pinned);}
  refreshCurrentList();
}
function renderPinned(m){
  const bar=$('#pinnedBar');
  if(!m){bar.hidden=true;return;}
  bar.hidden=false; bar.innerHTML=`📌 <span>${esc(m.content)}</span>`;
}
function deleteForMe(m){
  wsSend({event:'deletforme',data:{msgId:m.id,sender_phone:ME.phone}});
  const el=document.querySelector(`.msg[data-id="${m.id}"]`); if(el) el.remove();
}
function deleteForEveryone(m,kind){
  wsSend({event:'globaldelete',data:{msgId:m.id,sender_phone:ME.phone,msgType:kind}});
}
function applyGlobalDelete(data){
  if(!data) return;
  [...CONVOS.values(),...GROUPS.values()].forEach(c=>{
    const m=c.messages.find(x=>String(x.id)===String(data.messageId));
    if(m) m.visibility='none';
  });
  const el=document.querySelector(`.msg[data-id="${data.messageId}"]`);
  if(el){el.classList.add('deleted'); const b=el.querySelector('.bubble'); if(b) b.textContent='This message was deleted';}
}
function refreshCurrentList(){
  if(!current) return;
  if(current.type==='dm') renderMessages(CONVOS.get(current.peer).messages,'dm');
  else renderMessages(GROUPS.get(current.id).messages,'group');
}

/* ---------- new chat / new group ---------- */
function openModal(html){
  const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML=`<div class="modal">${html}</div>`;
  ov.onclick=e=>{if(e.target===ov) ov.remove();};
  document.body.appendChild(ov);
  return ov;
}
$('#newBtn').onclick=()=>{
  const ov=openModal(`<h2>Start something</h2>
    <div class="modal-actions" style="justify-content:stretch;gap:10px;">
      <button class="btn-primary" id="mkDm" style="flex:1;">New message</button>
      <button class="btn-primary" id="mkGroup" style="flex:1;">New group</button>
    </div>`);
  ov.querySelector('#mkDm').onclick=()=>{ov.remove(); newDmModal();};
  ov.querySelector('#mkGroup').onclick=()=>{ov.remove(); newGroupModal();};
};
function newDmModal(){
  const ov=openModal(`<h2>New message</h2>
    <div class="field"><label>Phone number</label><input id="dmPhone" placeholder="+91..."></div>
    <div class="modal-actions"><button class="btn-ghost" id="cnl">Cancel</button><button class="btn-primary" id="go">Start</button></div>`);
  ov.querySelector('#cnl').onclick=()=>ov.remove();
  ov.querySelector('#go').onclick=()=>{
    const phone=ov.querySelector('#dmPhone').value.trim();
    if(!phone) return;
    ov.remove(); openDM(phone);
  };
}
function newGroupModal(){
  const ov=openModal(`<h2>New group</h2>
    <div class="field"><label>Group name</label><input id="grpName"></div>
    <div class="modal-actions"><button class="btn-ghost" id="cnl">Cancel</button><button class="btn-primary" id="go">Create</button></div>`);
  ov.querySelector('#cnl').onclick=()=>ov.remove();
  ov.querySelector('#go').onclick=()=>{
    const name=ov.querySelector('#grpName').value.trim(); if(!name) return;
    const tempid='g'+Date.now();
    pending.set(tempid,{type:'createroom',name});
    wsSend({event:'create-room',data:{sender_phone:ME.phone,group_name:name,tempid}});
    ov.remove();
  };
}

/* ---------- group info panel ---------- */
$('#infoBtn').onclick=()=>{
  if(!current) return;
  if(current.type==='dm') return;
  const g=GROUPS.get(current.id);
  const isAdmin=g.admin===ME.phone;
  const rows=[...g.participants].map(p=>`<div class="participant-row"><span>${esc(p)}${p===g.admin?' (admin)':''}</span>${(isAdmin&&p!==ME.phone)?`<button data-p="${esc(p)}">Remove</button>`:''}</div>`).join('');
  const ov=openModal(`<h2>${esc(g.name)}</h2>
    ${rows}
    <div class="field" style="margin-top:14px;"><label>Add participant (phone)</label><input id="addPhone"></div>
    <div class="modal-actions"><button class="btn-ghost" id="addGo">Add</button></div>
    <div class="danger-zone">
      <button id="leaveGrp">Leave group</button>
      ${isAdmin?'<button id="delGrp">Delete group</button>':''}
    </div>`);
  ov.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    wsSend({event:'removeuser',data:{roomId:g.id,receiver_phone:b.dataset.p}});
    ov.remove();
  });
  ov.querySelector('#addGo').onclick=()=>{
    const ph=ov.querySelector('#addPhone').value.trim(); if(!ph) return;
    wsSend({event:'addtoroom',data:{roomId:g.id,receiver_phone:ph,sender_phone:ME.phone}});
    g.participants.add(ph); ov.remove(); renderSidebar();
  };
  ov.querySelector('#leaveGrp').onclick=()=>{
    wsSend({event:'leaveroom',data:{sender_phone:ME.phone,roomId:g.id}});
    GROUPS.delete(current.id); openEmpty(); renderSidebar(); ov.remove();
  };
  const delBtn=ov.querySelector('#delGrp');
  if(delBtn) delBtn.onclick=()=>{
    wsSend({event:'deletegroup',data:{roomId:g.id,sender_phone:ME.phone}});
    ov.remove();
  };
};
function handleGroupDeleted(data){
  if(!data) return;
  GROUPS.delete(String(data.groupId));
  if(current && current.type==='group' && String(current.id)===String(data.groupId)) openEmpty();
  renderSidebar(); toast('"'+data.groupName+'" was deleted');
}
function logout(){TOKEN=null; ME=null; subscribedPeer=null; if(ws) ws.close(); location.reload();}
</script>

<script>
/* ---------- theme toggle (presentational only — no chat logic touched) ---------- */
(function(){
  const root=document.documentElement;
  const btn=document.getElementById('themeBtn');
  const prefersLight=window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  root.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
  function paintIcon(){ btn.textContent = root.getAttribute('data-theme')==='dark' ? '◐' : '◑'; }
  paintIcon();
  btn.addEventListener('click', ()=>{
    root.setAttribute('data-theme', root.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
    paintIcon();
  });
})();
</script>
